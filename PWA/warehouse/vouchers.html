<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الأذونات المخزنية | الروائع ERP</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#6366f1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
<script src="../core.js"></script>
<script>var supabase = window.supabase;</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}.auth-bg{background:linear-gradient(135deg,#3730a3 0%,#4f46e5 40%,#6366f1 100%)}.card{background:#fff;border-radius:24px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.02),0 8px 24px rgba(0,0,0,.03);transition:all .2s ease}.card:active{transform:scale(.985)}.btn-primary{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;padding:1rem 1.5rem;border-radius:16px;font-weight:700;border:none;cursor:pointer;width:100%;box-shadow:0 4px 12px rgba(99,102,241,.25)}.btn-secondary{background:#f1f5f9;color:#1e293b;padding:.75rem 1.25rem;border-radius:14px;font-weight:700;border:none;cursor:pointer}.tab-btn{transition:all .2s ease}.tab-btn.active{border-bottom-color:#6366f1;color:#0f172a}.slide-in{animation:slideIn .3s ease}@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-bg p-4"><div class="bg-white rounded-[36px] shadow-2xl p-6 w-[92%] max-w-md slide-in"><div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-200 mb-5"><i class="fa-solid fa-file-signature text-white text-3xl"></i></div><h1 class="font-black text-2xl text-slate-800">الروائع</h1><p class="text-sm text-slate-400">الأذونات المخزنية</p></div><div class="space-y-4"><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none font-semibold text-sm"><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none font-semibold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2 p-2 text-slate-300"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div><button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white py-4 rounded-2xl font-bold text-base shadow-lg mt-6">تسجيل الدخول</button><p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-4 hidden"></p></div></div>
<div id="mainApp" class="hidden flex flex-col h-full"><header class="bg-gradient-to-r from-indigo-700 to-indigo-600 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0"><span class="font-black text-base">📄 الأذونات المخزنية</span><div class="flex items-center gap-2"><span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span id="connLabel" class="text-xs font-bold">متصل</span><button onclick="App.doLogout()" class="bg-white/15 w-9 h-9 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div></header><div class="flex gap-1.5 p-2 bg-white border-b border-slate-100 overflow-x-auto flex-shrink-0"><button onclick="App.switchTab('pending')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm active" id="tab-pending">📄 معلقة</button><button onclick="App.switchTab('completed')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400" id="tab-completed">✅ مكتملة</button><button onclick="App.switchTab('account')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400" id="tab-account">⚙️ حسابي</button></div><main id="mainContent" class="flex-1 overflow-y-auto p-4"></main></div>
<script>
var App={currentUser:null,currentTab:'pending',vouchers:[],newVoucherCart:[],companyId:null,mainBranchId:null,
togglePass:function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash'}else{p.type='password';i.className='fa-solid fa-eye'}},
doLogin:function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return}RW_UI.byId('loginMsg').classList.add('hidden');RW_UI.showLoader();RW_Auth.doLogin(e,p,function(u,er){RW_UI.hideLoader();if(er){RW_UI.byId('loginMsg').innerText=er;RW_UI.byId('loginMsg').classList.remove('hidden')}else App.init()})},
init:function(){var s=this;RW_Auth.init(function(u,er){if(er||!u){RW_UI.showError('انتهت الجلسة',function(){location.reload()});return}s.currentUser=u;if(!u.isOwner&&u.activeWarehouseRole!=='أذونات'){RW_UI.showError('دورك النشط هو "'+(u.activeWarehouseRole||'غير محدد')+'"',function(){RW_Auth.doLogout()});return}s.loadContext().then(function(){s.enterApp()}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل سياق الشركة')})})},
loadContext:function(){var s=this;return supabase.from('app_settings').select('company_id,main_branch_id').limit(1).maybeSingle().then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('تعذر قراءة سياق الشركة');s.companyId=r.data.company_id;s.mainBranchId=r.data.main_branch_id||null})},
enterApp:function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');RW_UI.updateConnectionStatus('connDot','connLabel');this.switchTab('pending')},
doLogout:function(){RW_Auth.doLogout(function(){RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden')})},
switchTab:function(tab){this.currentTab=tab;['pending','completed','account'].forEach(function(t){var b=RW_UI.byId('tab-'+t);if(b){b.classList.remove('active');b.classList.add('text-slate-400')}});var a=RW_UI.byId('tab-'+tab);if(a){a.classList.add('active');a.classList.remove('text-slate-400')}if(tab==='pending')this.loadVouchers('pending');else if(tab==='completed')this.loadVouchers('completed');else this.renderAccount()},
loadVouchers:function(scope){var self=this;RW_UI.showSkeleton('mainContent',3,'card');var statuses=scope==='pending'?['Draft','Sent']:['Received','Completed','Cancelled'];supabase.from('stock_vouchers').select('*').in('status',statuses).order('voucher_date',{ascending:false}).limit(50).then(function(r){if(r.error){RW_UI.showError(r.error.message||'فشل تحميل الأذونات');return}self.vouchers=r.data||[];self._renderList(scope)}).catch(function(e){RW_UI.showError(e.message||'فشل تحميل الأذونات')})},
_isManualType:function(v){return ['Transfer','DirectSale','DirectReturn','SupplierReturn'].indexOf(v.type)!==-1||v.source==='Manual'||v.type==='Adjustment'},
_renderList:function(scope){var h='<div class="mb-4 flex justify-between items-center"><p class="text-slate-400 text-sm">أهلاً، <span class="font-bold text-slate-700">'+(this.currentUser.name||'زميل')+'</span> 👋</p>'+(scope==='pending'?'<button onclick="App.openNewVoucherModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm"><i class="fa-solid fa-plus ml-1"></i> إذن جديد</button>':'')+'</div><input type="text" id="voucherSearch" placeholder="🔍 بحث..." class="w-full p-3 bg-white rounded-2xl border-2 border-slate-100 focus:border-indigo-400 outline-none font-semibold text-sm shadow-sm mb-4" oninput="App._filterAndRender()"><h2 class="text-lg font-black mb-4">'+(scope==='pending'?'📄 أذونات معلقة':'✅ أذونات مكتملة')+'</h2>';var manual=this.vouchers.filter(this._isManualType);h+=this._buildCardsHTML(manual,scope==='pending');RW_UI.safeHTML(RW_UI.byId('mainContent'),h)},
_filterAndRender:function(){var q=(RW_UI.byId('voucherSearch')?RW_UI.byId('voucherSearch').value:'').toLowerCase();var d=this.vouchers.filter(this._isManualType).filter(function(v){return((v.voucher_code||'').toLowerCase().indexOf(q)!==-1||(v.type||'').toLowerCase().indexOf(q)!==-1)});var c=RW_UI.byId('voucherCardsContainer');if(c)RW_UI.safeHTML(c,this._buildCardsHTML(d,this.currentTab==='pending'))},
_statusMeta:function(status){if(status==='Draft')return['bg-amber-100','text-amber-700','مسودة'];if(status==='Sent')return['bg-blue-100','text-blue-700','مُرسل'];if(status==='Received')return['bg-emerald-100','text-emerald-700','مستلم'];if(status==='Completed')return['bg-green-100','text-green-700','مكتمل'];if(status==='Cancelled')return['bg-red-100','text-red-700','ملغى'];return['bg-slate-100','text-slate-700',status||'غير محدد']},
_buildCardsHTML:function(data,showActions){if(!data.length)return'<div id="voucherCardsContainer" class="text-center py-12"><div class="text-6xl mb-4">☕</div><p class="text-slate-400 font-bold">لا توجد أذونات.</p></div>';var h='<div id="voucherCardsContainer">';for(var i=0;i<data.length;i++){var v=data[i],m=this._statusMeta(v.status);h+='<div class="card mb-3 cursor-pointer slide-in" onclick="App.viewVoucherDetails(\''+v.voucher_code+'\')"><div class="flex justify-between items-center gap-2"><div><span class="font-black">'+v.voucher_code+'</span><p class="text-xs text-slate-400">'+(v.voucher_date||'')+' | '+(v.type||'')+'</p></div><div class="flex items-center gap-2 flex-wrap justify-end"><span class="px-2 py-0.5 rounded-full text-xs font-bold '+m[0]+' '+m[1]+'">'+m[2]+'</span>';if(showActions&&v.status==='Draft'){h+='<button onclick="event.stopPropagation();App.sendVoucher(\''+v.voucher_code+'\')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">إرسال</button><button onclick="event.stopPropagation();App.cancelVoucher(\''+v.voucher_code+'\')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">إلغاء</button>'}if(showActions&&v.status==='Sent'){if(v.type==='Transfer'||v.type==='DirectReturn')h+='<button onclick="event.stopPropagation();App.receiveVoucher(\''+v.voucher_code+'\')" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold">استلام</button>';if(v.type==='DirectSale'||v.type==='SupplierReturn')h+='<button onclick="event.stopPropagation();App.completeVoucher(\''+v.voucher_code+'\')" class="bg-purple-600 text-white px-3 py-1 rounded-lg text-xs font-bold">إكمال</button>'}if(showActions&&v.status==='Received')h+='<button onclick="event.stopPropagation();App.completeVoucher(\''+v.voucher_code+'\')" class="bg-purple-600 text-white px-3 py-1 rounded-lg text-xs font-bold">إكمال</button>';h+='</div></div></div>'}return h+'</div>'},
_getError:function(e){return e&&e.message?e.message:(e&&e.error&&e.error.message?e.error.message:'حدث خطأ غير معروف')},
_sendRpc:function(code){var s=this;return supabase.rpc('send_manual_stock_voucher_v2',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.currentUser.email})},
_receiveRpc:function(code,items){var s=this;return supabase.rpc('receive_manual_stock_voucher_v2',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.currentUser.email,p_received_items:items})},
_completeRpc:function(code){var s=this;return supabase.rpc('complete_manual_stock_voucher_atomic',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.currentUser.email})},
_cancelRpc:function(code){var s=this;return supabase.rpc('cancel_manual_stock_voucher_atomic',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.currentUser.email})},
_resolveBranch:function(value,allowBlankMain){var s=this,value0=(value||'').trim();if(!value0&&allowBlankMain&&s.mainBranchId)return Promise.resolve(s.mainBranchId);if(!value0)return Promise.resolve(null);return supabase.from('branches').select('id,branch_code,name').or('id.eq.'+value0+',branch_code.eq.'+value0).limit(1).maybeSingle().then(function(r){if(r.error||!r.data)throw new Error('الفرع غير موجود: '+value0);return r.data.id})},
_createRpc:function(payload){var s=this;return supabase.rpc('create_manual_stock_voucher_atomic',payload)},
sendVoucher:function(code){var s=this;RW_UI.showConfirm('إرسال '+code+'؟',function(){RW_UI.showLoader();s._sendRpc(code).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message||'فشل الإرسال');return}if(!r.data||r.data.success!==true){RW_UI.showError((r.data&&r.data.msg)||'فشل الإرسال');return}RW_UI.toast('تم الإرسال','success');s.loadVouchers('pending')}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})})},
receiveVoucher:function(code){var s=this;RW_UI.showLoader();supabase.from('stock_vouchers').select('id,type,status').eq('voucher_code',code).maybeSingle().then(function(vr){if(vr.error||!vr.data)throw new Error('الإذن غير موجود');return supabase.from('stock_voucher_details').select('item_code,item_name,qty,received_qty').eq('voucher_id',vr.data.id).then(function(dr){if(dr.error)throw dr.error;var details=dr.data||[];if(!details.length)throw new Error('لا توجد أصناف');var h='<div class="text-right space-y-3">';for(var i=0;i<details.length;i++){var d=details[i],remaining=Math.max(0,Number(d.qty||0)-Number(d.received_qty||0));h+='<div class="border rounded-xl p-3"><div class="font-bold">'+(d.item_name||d.item_code)+'</div><div class="text-xs text-slate-500 mt-1">المطلوب: '+d.qty+' | المستلم: '+(d.received_qty||0)+' | المتبقي: '+remaining+'</div><input data-item-code="'+d.item_code+'" data-remaining="'+remaining+'" type="number" min="0" max="'+remaining+'" value="'+(remaining>0?remaining:0)+'" class="receive-qty w-full p-2 mt-2 border rounded-xl" placeholder="كمية الاستلام الآن"></div>'}h+='</div>';RW_UI.hideLoader();Swal.fire({title:'استلام جزئي / كامل',html:h,width:'620px',showCancelButton:true,confirmButtonText:'تنفيذ الاستلام',cancelButtonText:'إلغاء',preConfirm:function(){var inputs=[].slice.call(Swal.getPopup().querySelectorAll('.receive-qty'));var items=[];for(var j=0;j<inputs.length;j++){var q=Number(inputs[j].value||0),rem=Number(inputs[j].dataset.remaining||0);if(q<0||q>rem){Swal.showValidationMessage('الكمية يجب أن تكون بين 0 والمتبقي');return false}if(q>0)items.push({itemCode:inputs[j].dataset.itemCode,receivedQty:q})}if(!items.length){Swal.showValidationMessage('أدخل كمية واحدة على الأقل');return false}return items}}).then(function(r){if(!r.isConfirmed)return;RW_UI.showLoader();s._receiveRpc(code,r.value).then(function(x){RW_UI.hideLoader();if(x.error){RW_UI.showError(x.error.message||'فشل الاستلام');return}if(!x.data||x.data.success!==true){RW_UI.showError((x.data&&x.data.msg)||'فشل الاستلام');return}RW_UI.toast('تم الاستلام','success');s.loadVouchers('pending')}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})})})}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})},
completeVoucher:function(code){var s=this;RW_UI.showConfirm('إكمال '+code+'؟',function(){RW_UI.showLoader();s._completeRpc(code).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message||'فشل الإكمال');return}if(!r.data||r.data.success!==true){RW_UI.showError((r.data&&r.data.msg)||'فشل الإكمال');return}RW_UI.toast('تم الإكمال','success');s.loadVouchers(s.currentTab)}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})})},
cancelVoucher:function(code){var s=this;RW_UI.showConfirm('إلغاء '+code+'؟',function(){RW_UI.showLoader();s._cancelRpc(code).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message||'فشل الإلغاء');return}if(!r.data||r.data.success!==true){RW_UI.showError((r.data&&r.data.msg)||'فشل الإلغاء');return}RW_UI.toast('تم إلغاء الإذن','success');s.loadVouchers('pending')}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})})},
viewVoucherDetails:function(code){var s=this;RW_UI.showLoader();supabase.from('stock_vouchers').select('id').eq('voucher_code',code).maybeSingle().then(function(vr){if(vr.error||!vr.data)throw new Error('الإذن غير موجود');return supabase.from('stock_voucher_details').select('*').eq('voucher_id',vr.data.id).then(function(r){RW_UI.hideLoader();if(r.error)throw r.error;var its=r.data||[],h='<div class="text-right"><h3 class="font-black text-lg mb-4">'+code+'</h3>';if(!its.length)h+='<p class="text-slate-400 text-center py-4">لا توجد أصناف</p>';else{h+='<table class="w-full text-sm border"><thead class="bg-slate-100"><tr><th class="p-2">الصنف</th><th class="p-2 text-center">الكمية</th><th class="p-2 text-center">المستلمة</th><th class="p-2 text-center">المتبقي</th></tr></thead><tbody>';for(var i=0;i<its.length;i++){var rem=Math.max(0,Number(its[i].qty||0)-Number(its[i].received_qty||0));h+='<tr class="border-t"><td class="p-2 font-semibold">'+(its[i].item_name||its[i].item_code)+'</td><td class="p-2 text-center">'+(its[i].qty||0)+'</td><td class="p-2 text-center">'+(its[i].received_qty||0)+'</td><td class="p-2 text-center">'+rem+'</td></tr>'}h+='</tbody></table>'}h+='</div>';Swal.fire({title:'تفاصيل الإذن',html:h,width:'680px',showCloseButton:true,showConfirmButton:false,customClass:{popup:'!rounded-3xl'}})})}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(s._getError(e))})},
openNewVoucherModal:function(){var self=this;self.newVoucherCart=[];var h='<div class="text-right"><div class="mb-3"><label class="text-xs font-bold">نوع الإذن</label><select id="newVoucherType" class="w-full p-2.5 border rounded-xl text-sm"><option value="Transfer">تحويل داخلي</option><option value="DirectSale">صرف مباشر</option><option value="DirectReturn">مرتجع مباشر</option><option value="SupplierReturn">مرتجع لمورد</option></select></div><div class="mb-3 space-y-2"><input id="newVoucherFromBranch" class="w-full p-2.5 border rounded-xl text-sm" placeholder="فرع المصدر (افتراضي الرئيسي)"><input id="newVoucherToBranch" class="w-full p-2.5 border rounded-xl text-sm" placeholder="فرع الوجهة"><input id="newVoucherSupplier" class="w-full p-2.5 border rounded-xl text-sm hidden" placeholder="معرف المورد (UUID)"></div><div class="mb-3"><label class="text-xs font-bold">ملاحظات</label><input id="newVoucherNotes" class="w-full p-2.5 border rounded-xl text-sm"></div><div class="mb-3"><label class="text-xs font-bold">بحث عن صنف</label><input type="text" id="newVoucherItemSearch" placeholder="ابحث..." class="w-full p-2.5 border rounded-xl text-sm" oninput="App.searchVoucherItem(this.value)"><div id="newVoucherItemResults" class="max-h-48 overflow-y-auto border rounded-xl mt-1"></div></div><div><h4 class="font-bold text-sm mb-1">الأصناف المضافة</h4><div id="newVoucherCart"><p class="text-slate-400 text-center py-2">لا توجد أصناف</p></div></div></div>';Swal.fire({title:'إذن جديد',html:h,width:'600px',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',customClass:{popup:'!rounded-3xl'},didOpen:function(){var p=Swal.getPopup(),t=p.querySelector('#newVoucherType'),f=p.querySelector('#newVoucherFromBranch'),to=p.querySelector('#newVoucherToBranch'),s=p.querySelector('#newVoucherSupplier');function sync(){var x=t.value;f.value=x==='DirectReturn'?'':(f.value||'');f.placeholder=x==='DirectReturn'?'فرع المصدر (اختياري)':'فرع المصدر (افتراضي الرئيسي)';to.placeholder=x==='DirectSale'?'فرع الوجهة / السيارة':(x==='DirectReturn'?'فرع الوجهة (افتراضي الرئيسي)':'فرع الوجهة');s.classList.toggle('hidden',x!=='SupplierReturn');to.classList.toggle('hidden',x==='SupplierReturn')}t.addEventListener('change',sync);sync()},preConfirm:function(){var p=Swal.getPopup(),type=p.querySelector('#newVoucherType').value,notes=p.querySelector('#newVoucherNotes').value,from=p.querySelector('#newVoucherFromBranch').value.trim(),to=p.querySelector('#newVoucherToBranch').value.trim(),supplier=p.querySelector('#newVoucherSupplier').value.trim();if(!self.newVoucherCart.length){Swal.showValidationMessage('أضف صنفاً');return false}if(type==='Transfer'&&!to){Swal.showValidationMessage('أدخل فرع الوجهة');return false}if(type==='SupplierReturn'&&!supplier){Swal.showValidationMessage('أدخل معرف المورد');return false}return{type:type,notes:notes,from:from,to:to,supplier:supplier}}}).then(function(r){if(!r.isConfirmed)return;var b=r.value;Promise.all([self._resolveBranch(b.from,true),self._resolveBranch(b.to,typeSafeTarget(b.type,self))]).then(function(ids){var fromId=ids[0],toId=ids[1];if(!fromId&&b.type!=='DirectReturn'){throw new Error('فرع المصدر غير محدد')}if(!toId&&b.type!=='SupplierReturn'){throw new Error('فرع الوجهة غير محدد')}var its=self.newVoucherCart.map(function(x){return{itemCode:x.code,qty:x.qty,unitPrice:0,notes:''}});var payload={p_company_id:self.companyId,p_type:b.type,p_reference:'',p_from_type:b.type==='SupplierReturn'?'Branch':'Branch',p_from_id:fromId,p_to_type:b.type==='SupplierReturn'?'Supplier':'Branch',p_to_id:b.type==='SupplierReturn'?b.supplier:toId,p_notes:b.notes||'',p_created_by:self.currentUser.email,p_items:its};RW_UI.showLoader();self._createRpc(payload).then(function(j){RW_UI.hideLoader();if(j.error){RW_UI.showError(j.error.message||'فشل إنشاء الإذن');return}if(!j.data||j.data.success!==true){RW_UI.showError((j.data&&j.data.msg)||'فشل إنشاء الإذن');return}RW_UI.toast('تم '+(j.data.voucher_code||''),'success');self.loadVouchers('pending')}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(self._getError(e))})}).catch(function(e){RW_UI.showError(e.message||'خطأ في تحديد الفروع')})})},
searchVoucherItem:function(q){if(!q||!q.trim()){var p=Swal.getPopup();if(p){var d=p.querySelector('#newVoucherItemResults');if(d)d.innerHTML=''}return}supabase.from('items').select('item_code,name,unit').or('name.ilike.%'+q+'%,item_code.ilike.%'+q+'%').limit(8).then(function(r){var a=r.data||[],h='';for(var i=0;i<a.length;i++)h+='<div onclick="App.addToNewVoucherCart(\''+a[i].item_code+'\',\''+(a[i].name||'').replace(/'/g,"\\'")+'\',\''+(a[i].unit||'حبة')+'\')" class="p-2 border-b hover:bg-indigo-50 cursor-pointer font-bold text-sm">'+a[i].name+' ('+a[i].item_code+')</div>';var p=Swal.getPopup();if(p){var d=p.querySelector('#newVoucherItemResults');if(d)d.innerHTML=h||'<p class="p-2 text-slate-400">لا توجد نتائج</p>'}})},
addToNewVoucherCart:function(code,name,unit){var e=this.newVoucherCart.find(function(x){return x.code===code});if(e)e.qty++;else this.newVoucherCart.push({code:code,name:name,unit:unit,qty:1});this.renderNewVoucherCart()},
renderNewVoucherCart:function(){var p=Swal.getPopup();if(!p)return;var d=p.querySelector('#newVoucherCart');if(!d)return;if(!this.newVoucherCart.length){d.innerHTML='<p class="text-slate-400 text-center py-2">لا توجد أصناف</p>';return}var h='';for(var i=0;i<this.newVoucherCart.length;i++){var x=this.newVoucherCart[i];h+='<div class="flex justify-between items-center p-2 border-b"><span class="font-bold text-sm">'+x.name+' <span class="text-slate-400">('+x.code+')</span></span><div class="flex items-center gap-2"><button onclick="App.changeNewCartQty('+i+',-1)" class="w-6 h-6 bg-slate-100 rounded-full text-xs">-</button><span class="w-6 text-center font-bold">'+x.qty+'</span><button onclick="App.changeNewCartQty('+i+',1)" class="w-6 h-6 bg-indigo-600 text-white rounded-full text-xs">+</button></div></div>'}d.innerHTML=h},
changeNewCartQty:function(idx,delta){this.newVoucherCart[idx].qty+=delta;if(this.newVoucherCart[idx].qty<=0)this.newVoucherCart.splice(idx,1);this.renderNewVoucherCart()},
renderAccount:function(){var h='<div class="text-center mb-8 mt-4"><div class="w-20 h-20 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl font-black shadow-lg mb-4">'+(this.currentUser.name||'?').charAt(0)+'</div><h2 class="font-black text-xl">'+(this.currentUser.name||this.currentUser.email)+'</h2><p class="text-sm text-slate-400">أذونات مخزنية</p></div><div class="card mb-3"><p class="text-xs text-slate-400">البريد</p><p class="font-bold text-sm">'+this.currentUser.email+'</p></div><button onclick="App.doLogout()" class="w-full bg-white border-2 border-red-100 text-red-500 py-4 rounded-2xl font-bold mt-6">تسجيل الخروج</button>';RW_UI.safeHTML(RW_UI.byId('mainContent'),h)},
closeApp:function(){}
};
function typeSafeTarget(type,app){return type==='SupplierReturn'?false:true}
RW_SW.register('../sw.js');document.addEventListener('DOMContentLoaded',function(){App.init()});
