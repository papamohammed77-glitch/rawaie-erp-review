<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الأذونات المخزنية | الروائع ERP</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#6366f1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../core.js"></script>
<script>var supabase=window.supabase;</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:#f8fafc}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px rgba(15,23,42,.05)}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}.muted{background:#f1f5f9;color:#334155}.badge{border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}</style>
</head>
<body class="min-h-screen">
<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-indigo-800 via-indigo-600 to-indigo-500 p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl"><div class="text-center mb-6"><div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-600 text-white flex items-center justify-center text-3xl mb-4">📄</div><h1 class="text-2xl font-black">الروائع</h1><p class="text-sm text-slate-400">الأذونات المخزنية</p></div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3 rounded-xl border mb-3"><input id="loginPass" type="password" placeholder="كلمة السر" class="w-full p-3 rounded-xl border mb-3"><button class="btn primary w-full" onclick="App.login()">تسجيل الدخول</button><p id="loginMsg" class="text-red-500 text-xs font-bold mt-3"></p></div></div>
<div id="app" class="hidden min-h-screen"><header class="sticky top-0 z-30 bg-white border-b p-4 flex justify-between items-center"><div><b>📄 الأذونات المخزنية</b><div id="userLabel" class="text-xs text-slate-400"></div></div><button class="btn muted" onclick="App.logout()">خروج</button></header><nav class="bg-white border-b p-2 flex gap-2 overflow-auto"><button id="tabPending" class="btn primary" onclick="App.switchTab('pending')">معلقة</button><button id="tabDone" class="btn muted" onclick="App.switchTab('done')">مكتملة</button><button id="tabAccount" class="btn muted" onclick="App.switchTab('account')">حسابي</button></nav><main id="main" class="p-4 max-w-6xl mx-auto"></main></div>
<script>
var App={user:null,companyId:null,mainBranchId:null,tab:'pending',vouchers:[],cart:[],type:'Transfer',branches:[],suppliers:[],drivers:[],types:{Transfer:{label:'تحويل',from:'Branch',to:'Branch'},DirectSale:{label:'صرف عهدة سيارة/مندوب',from:'Branch',to:'Branch'},DirectReturn:{label:'مرتجع من سيارة/مندوب',from:'Branch',to:'Branch'},SupplierReturn:{label:'مرتجع لمورد',from:'Branch',to:'Supplier'}},
login:function(){var e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value.trim();if(!e||!p){document.getElementById('loginMsg').textContent='أدخل بيانات الدخول';return}RW_UI.showLoader();RW_Auth.doLogin(e,p,function(u,err){RW_UI.hideLoader();if(err){document.getElementById('loginMsg').textContent=err;return}App.init()})},
init:function(){var s=this;RW_Auth.init(function(u,err){if(err||!u){RW_UI.showError('انتهت الجلسة');return}if(!u.isOwner&&u.activeWarehouseRole!=='أذونات'){RW_UI.showError('ليس لديك صلاحية الأذونات');RW_Auth.doLogout();return}s.user=u;Promise.all([s.loadContext(),s.loadBranches(),s.loadSuppliers(),s.loadDrivers()]).then(function(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLabel').textContent=u.name||u.email;s.switchTab('pending')}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل السياق')})})},
loadContext:function(){var s=this;return supabase.from('app_settings').select('company_id,main_branch_id').limit(1).maybeSingle().then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('تعذر قراءة سياق الشركة');s.companyId=r.data.company_id;s.mainBranchId=r.data.main_branch_id})},
loadBranches:function(){var s=this;return supabase.from('branches').select('id,company_id,branch_code,name,is_active').eq('is_active',true).eq('company_id',s.companyId).order('name').then(function(r){if(r.error)throw r.error;s.branches=r.data||[]})},
loadSuppliers:function(){var s=this;return supabase.from('suppliers').select('id,company_id,supplier_code,name,phone,area').eq('company_id',s.companyId).order('name').then(function(r){if(r.error)throw r.error;s.suppliers=r.data||[]})},
loadDrivers:function(){var s=this;return supabase.from('users').select('id,email,name,phone,role,active_warehouse_role').eq('company_id',s.companyId).or('role.eq.driver,active_warehouse_role.eq.مندوب').order('name').then(function(r){if(r.error)throw r.error;s.drivers=r.data||[]})},
logout:function(){RW_Auth.doLogout(function(){location.reload()})},
switchTab:function(t){this.tab=t;['tabPending','tabDone','tabAccount'].forEach(function(id){var b=document.getElementById(id);b.classList.remove('primary');b.classList.add('muted')});document.getElementById(t==='pending'?'tabPending':t==='done'?'tabDone':'tabAccount').classList.add('primary');if(t==='account')return this.account();this.list(t)},
list:function(scope){var s=this;RW_UI.showSkeleton('main',3,'card');var sts=scope==='pending'?['Draft','Sent']:['Received','Completed','Cancelled'];supabase.from('stock_vouchers').select('*').eq('company_id',s.companyId).in('status',sts).order('created_at',{ascending:false}).limit(100).then(function(r){if(r.error){RW_UI.showError(r.error.message);return}s.vouchers=r.data||[];s.renderList()})},
renderList:function(){var h='<div class="flex justify-between items-center mb-4"><h2 class="font-black text-xl">'+(this.tab==='pending'?'الأذونات المعلقة':'الأذونات المكتملة')+'</h2>'+(this.tab==='pending'?'<button class="btn primary" onclick="App.openCreate()">+ إذن جديد</button>':'')+'</div><input id="search" oninput="App.filter()" placeholder="بحث برقم الإذن أو النوع" class="w-full p-3 rounded-xl border mb-4"><div id="cards">';var s=this;this.vouchers.filter(function(v){return ['Transfer','DirectSale','DirectReturn','SupplierReturn'].indexOf(v.type)>=0}).forEach(function(v){var actions='';if(s.tab==='pending'&&v.status==='Draft')actions='<button class="btn primary text-xs" onclick="event.stopPropagation();App.send(\''+v.voucher_code+'\')">إرسال</button><button class="btn danger text-xs" onclick="event.stopPropagation();App.cancel(\''+v.voucher_code+'\')">إلغاء</button>';if(s.tab==='pending'&&v.status==='Sent'&&(v.type==='Transfer'||v.type==='DirectReturn'))actions='<button class="btn success text-xs" onclick="event.stopPropagation();App.receive(\''+v.voucher_code+'\')">استلام</button>';if(s.tab==='pending'&&((v.status==='Sent'&&(v.type==='DirectSale'||v.type==='SupplierReturn'))||v.status==='Received'))actions='<button class="btn primary text-xs" onclick="event.stopPropagation();App.complete(\''+v.voucher_code+'\')">إكمال</button>';h+='<div class="card mb-3 cursor-pointer" data-search="'+((v.voucher_code||'')+' '+(v.type||'')).toLowerCase()+'" onclick="App.details(\''+v.voucher_code+'\')"><div class="flex justify-between gap-3"><div><b>'+v.voucher_code+'</b><div class="text-xs text-slate-400">'+v.type+' · '+(v.voucher_date||'')+'</div></div><div class="flex gap-2 items-center"><span class="badge bg-slate-100">'+(v.status||'')+'</span>'+actions+'</div></div></div>'});h+='</div>';RW_UI.safeHTML(document.getElementById('main'),h)},
filter:function(){var q=(document.getElementById('search').value||'').toLowerCase();document.querySelectorAll('#cards .card').forEach(function(x){x.style.display=x.dataset.search.indexOf(q)>=0?'':'none'})},
account:function(){RW_UI.safeHTML(document.getElementById('main'),'<div class="card"><h2 class="font-black text-xl mb-3">حسابي</h2><p class="text-sm">'+(this.user.name||'')+'</p><p class="text-xs text-slate-400">'+(this.user.email||'')+'</p></div>')},
openCreate:function(){this.cart=[];this.type='Transfer';this.renderCreate()},
renderCreate:function(){var s=this,opts=Object.keys(this.types).map(function(k){return '<option value="'+k+'" '+(s.type===k?'selected':'')+'>'+s.types[k].label+'</option>'}).join('');var html='<div class="card"><div class="flex justify-between items-center mb-4"><h2 class="font-black text-xl">إذن جديد</h2><button class="btn muted" onclick="App.switchTab(\'pending\')">رجوع</button></div><label class="text-xs font-bold">نوع الإذن</label><select id="vType" class="w-full p-3 border rounded-xl my-2" onchange="App.type=this.value;App.renderCreate()">'+opts+'</select><div class="grid2">'+this.contextFields()+'</div><div class="mt-4"><label class="text-xs font-bold">بحث صنف</label><input id="itemSearch" class="w-full p-3 border rounded-xl" oninput="App.searchItems(this.value)" placeholder="الكود أو الاسم"><div id="itemResults" class="mt-2"></div></div><div id="cart" class="mt-4">'+this.renderCart()+'</div><input id="notes" class="w-full p-3 border rounded-xl mt-3" placeholder="ملاحظات"><button class="btn primary w-full mt-3" onclick="App.create()">إنشاء Draft</button></div>';RW_UI.safeHTML(document.getElementById('main'),html)},
contextFields:function(){var h='';if(this.type==='Transfer'){h+='<div><label class="text-xs font-bold">من فرع</label><select id="fromId" class="w-full p-3 border rounded-xl">'+this.branchOptions(this.mainBranchId)+'</select></div><div><label class="text-xs font-bold">إلى فرع</label><select id="toId" class="w-full p-3 border rounded-xl">'+this.branchOptions('')+'</select></div>'}else if(this.type==='DirectSale'){h+='<div><label class="text-xs font-bold">من MAIN</label><select id="fromId" class="w-full p-3 border rounded-xl">'+this.branchOptions(this.mainBranchId)+'</select></div><div><label class="text-xs font-bold">المندوب / السيارة</label><select id="toId" class="w-full p-3 border rounded-xl">'+this.vanOptions()+'</select><p class="text-xs text-amber-600 mt-1">يجب أن يكون فرع VAN-{email} موجودًا مسبقًا. لا تنشئ الواجهة فرعًا تلقائيًا.</p></div>'}else if(this.type==='DirectReturn'){h+='<div><label class="text-xs font-bold">المندوب / السيارة</label><select id="fromId" class="w-full p-3 border rounded-xl">'+this.vanOptions()+'</select></div><div><label class="text-xs font-bold">إلى MAIN</label><select id="toId" class="w-full p-3 border rounded-xl">'+this.branchOptions(this.mainBranchId)+'</select></div>'}else{h+='<div><label class="text-xs font-bold">من MAIN</label><select id="fromId" class="w-full p-3 border rounded-xl">'+this.branchOptions(this.mainBranchId)+'</select></div><div><label class="text-xs font-bold">المورد</label><select id="toId" class="w-full p-3 border rounded-xl">'+this.supplierOptions()+'</select></div>'}return h},
branchOptions:function(selected){return '<option value="">-- اختر --</option>'+this.branches.map(function(b){return '<option value="'+b.id+'" '+(b.id===selected?'selected':'')+'>'+b.branch_code+' — '+b.name+'</option>'}).join('')},
supplierOptions:function(){return '<option value="">-- اختر المورد --</option>'+this.suppliers.map(function(x){return '<option value="'+x.id+'">'+x.supplier_code+' — '+x.name+'</option>'}).join('')},
vanOptions:function(){var seen={},h='<option value="">-- اختر VAN الموجود --</option>';this.drivers.forEach(function(d){var code='VAN-'+d.email,b=App.branches.find(function(x){return x.branch_code===code||x.name===code});if(b&&!seen[b.id]){seen[b.id]=1;h+='<option value="'+b.id+'">'+(d.name||d.email)+' — '+b.branch_code+'</option>'}});this.branches.filter(function(b){return String(b.branch_code||'').indexOf('VAN-')===0}).forEach(function(b){if(!seen[b.id])h+='<option value="'+b.id+'">'+b.branch_code+' — '+b.name+'</option>'});return h},
searchItems:function(q){var s=this;if(!q||q.trim().length<1){document.getElementById('itemResults').innerHTML='';return}supabase.from('items').select('id,item_code,name,unit,sales_price,is_active,company_id').eq('company_id',s.companyId).eq('is_active',true).or('item_code.ilike.%'+q+'%,name.ilike.%'+q+'%').limit(10).then(function(r){if(r.error){document.getElementById('itemResults').textContent=r.error.message;return}document.getElementById('itemResults').innerHTML=(r.data||[]).map(function(i){return '<button class="w-full text-right p-3 border-b bg-white" onclick="App.addItem(\''+i.id+'\',\''+String(i.item_code).replace(/'/g,'\\\'')+'\',\''+String(i.name||'').replace(/'/g,'\\\'')+'\',\''+String(i.unit||'حبة').replace(/'/g,'\\\'')+'\')"><b>'+i.item_code+'</b> — '+i.name+' <span class="text-xs text-slate-400">'+i.unit+'</span></button>'}).join('')||'<div class="p-3 text-slate-400">لا توجد نتائج</div>'})},
addItem:function(id,code,name,unit){var x=this.cart.find(function(i){return i.itemCode===code});if(x)x.qty++;else this.cart.push({itemId:id,itemCode:code,itemName:name,unit:unit,qty:1,unitPrice:0});this.renderCreate()},
renderCart:function(){if(!this.cart.length)return '<div class="p-4 rounded-xl bg-slate-50 text-center text-slate-400">السلة فارغة</div>';return this.cart.map(function(i,n){return '<div class="flex justify-between items-center border-b py-3"><div><b>'+i.itemCode+'</b><div class="text-xs text-slate-500">'+i.itemName+'</div></div><div class="flex items-center gap-2"><button class="btn muted" onclick="App.qty('+n+',-1)">−</button><b>'+i.qty+'</b><button class="btn muted" onclick="App.qty('+n+',1)">+</button><button class="btn danger" onclick="App.remove('+n+')">×</button></div></div>'}).join('')},
qty:function(n,d){this.cart[n].qty+=d;if(this.cart[n].qty<=0)this.cart.splice(n,1);this.renderCreate()},remove:function(n){this.cart.splice(n,1);this.renderCreate()},
create:function(){var s=this;if(!this.cart.length){RW_UI.showError('أضف صنفًا واحدًا على الأقل');return}var from=document.getElementById('fromId').value,to=document.getElementById('toId').value;if(!from||!to){RW_UI.showError('حدد المصدر والهدف');return}var payload={p_company_id:this.companyId,p_type:this.type,p_reference:'UI-'+new Date().toISOString(),p_from_type:this.types[this.type].from,p_from_id:from,p_to_type:this.types[this.type].to,p_to_id:to,p_notes:document.getElementById('notes').value||'vouchers.html TASK-026',p_created_by:this.user.email,p_items:this.cart};RW_UI.showLoader();supabase.rpc('create_manual_stock_voucher_atomic',payload).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message);return}if(!r.data||r.data.success!==true){RW_UI.showError('فشل إنشاء الإذن');return}RW_UI.toast('تم إنشاء الإذن','success');s.switchTab('pending')})},
send:function(code){var s=this;RW_UI.showConfirm('إرسال '+code+'؟',function(){RW_UI.showLoader();supabase.rpc('send_manual_stock_voucher_v2',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.user.email}).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message);return}if(!r.data||r.data.success!==true){RW_UI.showError('فشل الإرسال');return}RW_UI.toast('تم الإرسال','success');s.list('pending')})})},
receive:function(code){var s=this;supabase.from('stock_vouchers').select('id').eq('company_id',this.companyId).eq('voucher_code',code).single().then(function(v){if(v.error)throw v.error;return supabase.from('stock_voucher_details').select('item_code,item_name,qty,received_qty,unit').eq('voucher_id',v.data.id)}).then(function(d){var body=(d.data||[]).map(function(x){var rem=Number(x.qty||0)-Number(x.received_qty||0);return '<div class="border-b p-3"><b>'+x.item_code+'</b><div class="text-xs">المطلوب '+x.qty+' · المستلم '+(x.received_qty||0)+' · المتبقي '+rem+'</div><input data-code="'+x.item_code+'" data-rem="'+rem+'" type="number" min="0" max="'+rem+'" value="0" class="receiveQty w-full p-2 border rounded-xl mt-2"></div>'}).join('');return Swal.fire({title:'استلام جزئي/كامل',html:body,showCancelButton:true,confirmButtonText:'استلام',preConfirm:function(){var rows=Array.prototype.slice.call(document.querySelectorAll('.receiveQty')),out=[];for(var i=0;i<rows.length;i++){var q=Number(rows[i].value||0),r=Number(rows[i].dataset.rem||0);if(q<0||q>r){Swal.showValidationMessage('الكمية تتجاوز المتبقي');return false}if(q>0)out.push({itemCode:rows[i].dataset.code,receivedQty:q})}if(!out.length){Swal.showValidationMessage('أدخل كمية استلام واحدة على الأقل');return false}return out}})}).then(function(x){if(!x.isConfirmed)return;RW_UI.showLoader();return supabase.rpc('receive_manual_stock_voucher_v2',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.user.email,p_received_items:x.value}).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message);return}if(!r.data||r.data.success!==true){RW_UI.showError('فشل الاستلام');return}RW_UI.toast('تم الاستلام','success');s.list('pending')})})}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(e.message)})},
complete:function(code){var s=this;RW_UI.showConfirm('إكمال '+code+'؟',function(){RW_UI.showLoader();supabase.rpc('complete_manual_stock_voucher_atomic',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.user.email}).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message);return}if(!r.data||r.data.success!==true){RW_UI.showError('فشل الإكمال');return}RW_UI.toast('تم الإكمال','success');s.list('pending')})})},
cancel:function(code){var s=this;RW_UI.showConfirm('إلغاء '+code+'؟',function(){RW_UI.showLoader();supabase.rpc('cancel_manual_stock_voucher_atomic',{p_company_id:s.companyId,p_voucher_code:code,p_user_email:s.user.email}).then(function(r){RW_UI.hideLoader();if(r.error){RW_UI.showError(r.error.message);return}if(!r.data||r.data.success!==true){RW_UI.showError('فشل الإلغاء');return}RW_UI.toast('تم الإلغاء','success');s.list('pending')})})},
details:function(code){var s=this;RW_UI.showLoader();supabase.from('stock_vouchers').select('*').eq('company_id',this.companyId).eq('voucher_code',code).single().then(function(v){if(v.error)throw v.error;return supabase.from('stock_voucher_details').select('*').eq('voucher_id',v.data.id).then(function(d){RW_UI.hideLoader();var h='<div class="text-right"><h3 class="font-black text-lg">'+code+'</h3><p class="text-sm text-slate-500">'+v.data.type+' · '+v.data.status+'</p>';(d.data||[]).forEach(function(x){h+='<div class="border-b py-2">'+x.item_code+' — '+x.item_name+' · '+x.qty+' '+x.unit+' · مستلم '+(x.received_qty||0)+'</div>'});h+='</div>';Swal.fire({title:'تفاصيل الإذن',html:h,showConfirmButton:false,showCloseButton:true,width:700})})}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(e.message)})}
};
window.addEventListener('load',function(){App.init()});
</script>
</body>
</html>
