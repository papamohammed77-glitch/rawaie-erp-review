        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;position:fixed;width:100%}
        body{font-family:'Cairo',sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;touch-action:manipulation;-webkit-touch-callout:none}
        :root{--sat:env(safe-area-inset-top);--sar:env(safe-area-inset-right);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left)}
        .auth-container{background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 40%,#2563eb 100%)}
        .input-field:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .no-scrollbar::-webkit-scrollbar{display:none}
        .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .animate-slide-up{animation:slideUp 0.3s ease-out}
        @keyframes pulse-badge{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

        .fab:active{transform:scale(0.92);box-shadow:0 2px 8px rgba(37,99,235,0.3)}
        .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>

<header class="bg-blue-700 text-white px-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0" style="padding-top:max(12px,var(--sat));min-height:56px">
    <div class="flex items-center gap-2"><i class="fa-solid fa-headset"></i><span class="font-black text-sm">التلي سيلز</span></div>
    <div class="flex items-center gap-2">
        <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span id="connLabel" class="text-[11px] font-bold">متصل</span>
        <div class="relative">
            <button onclick="App.toggleMoreMenu()" class="bg-white/10 w-8 h-8 rounded-full flex items-center justify-center" id="moreMenuBtn">
                <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
            </button>

                <button onclick="App.openCustomerModal(); App.toggleMoreMenu();" class="w-full flex items-center gap-3 px-4 py-3 text-right text-slate-700 hover:bg-slate-50 font-bold text-sm border-b border-slate-100">

                    <span>العملاء</span>

                <button onclick="App.doLogout();" class="w-full flex items-center gap-3 px-4 py-3 text-right text-red-500 hover:bg-red-50 font-bold text-sm">

</header>
    <div id="creditBanner" class="hidden text-center py-2 text-sm font-bold flex-shrink-0"></div>

        <div class="flex items-center gap-3"><div class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm" id="cartBadgeCount">0</div><div><div class="font-bold text-sm">سلة المشتريات</div><div class="text-xs text-gray-400" id="cartBadgeSummary">لا توجد أصناف</div></div></div>

    <button onclick="App.switchTab('my-orders')" class="tab-btn flex-1 flex flex-col items-center justify-center py-1 px-1 text-gray-400 relative" data-tab="my-orders">

        <div class="p-4 border-b flex justify-between items-center flex-shrink-0"><h2 class="font-black text-lg">مراجعة الأوردر</h2><button onclick="App.closeCartModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>

<!-- مودال العملاء -->

    <div class="bg-white rounded-t-3xl flex flex-col animate-slide-up" style="max-height:85vh">
        <div class="p-4 border-b flex justify-between items-center flex-shrink-0"><h2 class="font-black text-lg">العملاء</h2><button onclick="App.closeCustomerModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="p-4 flex-shrink-0"><input type="text" id="customerSearchInput" oninput="App.searchCustomersModal(this.value)" placeholder="🔍 ابحث عن عميل..." class="w-full p-3 bg-gray-50 border rounded-xl text-sm font-bold"></div>
        <div id="customerModalBody" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar"><div class="text-center text-gray-400 py-8">اكتب للبحث عن عميل...</div></div>
    </div>
</div>

<script>
function fmtNum(n) { return Number(n || 0).toLocaleString('ar-EG', {minimumFractionDigits: 2}); }

var App = (function() {
    var self = {};
    var db = RW_DB.getDB('Telesales');
    var currentUser = null, pubUserId = null, cart = [], selCust = null, selBranch = null, branchMap = {};
    var delFee = 0, taxRate = 0, minAmt = 0, currentTab = 'today', isListView = true;
    var editingOrderCode = null;
    var catalogListView = false, catalogActiveCat = 'الكل';
    var productsCache = [], customersCache = [];
    var _todayInterval = null;
    var _quickSearchTimer = null;

    // ==================== دوال المصادقة ====================
    self.togglePass = function() {
        var p = RW_UI.byId('loginPass'), i = RW_UI.byId('passIcon');
        if (p.type === 'password') { p.type = 'text'; i.className = 'fa-solid fa-eye-slash'; }
        else { p.type = 'password'; i.className = 'fa-solid fa-eye'; }
    };

    self.forgotPassword = function() {
        var email = RW_UI.byId('loginEmail').value.trim();
        if (!email) { RW_UI.toast('أدخل بريدك الإلكتروني أولاً', 'warning'); return; }
        RW_UI.showLoader('جاري إرسال رابط التعيين...');
        supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password' }).then(function(res) {
            RW_UI.hideLoader();
            if (res.error) RW_UI.toast(res.error.message, 'error');
            else RW_UI.toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك', 'success');
        }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشل الاتصال بالخادم', 'error'); });
    };

    self.doLogin = function() {
        var email = RW_UI.byId('loginEmail').value.trim(), pass = RW_UI.byId('loginPass').value.trim();
        if (!email || !pass) { RW_UI.byId('loginMsg').innerText = 'أدخل البريد الإلكتروني وكلمة المرور'; RW_UI.byId('loginMsg').classList.remove('hidden'); return; }
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(email, pass, function(user, err) {
            RW_UI.hideLoader();
            if (err) { RW_UI.byId('loginMsg').innerText = err; RW_UI.byId('loginMsg').classList.remove('hidden'); }
            else {
                if (RW_UI.byId('rememberMe').checked) localStorage.setItem('telesales_remember_email', email);
                else localStorage.removeItem('telesales_remember_email');
                self.init(user);
            }
        });
    };

    self.init = function(user) {
        var remembered = localStorage.getItem('telesales_remember_email');
        if (remembered) { RW_UI.byId('loginEmail').value = remembered; RW_UI.byId('rememberMe').checked = true; }
        function _setup(u) {
            if (!u) { RW_UI.showError('فشل استعادة الجلسة'); return; }
            var isOwner = u.isOwner, perms = u.permissions || [];
            if (!isOwner && perms.indexOf('orders') === -1 && perms.indexOf('telesales') === -1) { RW_UI.showError('غير مصرح – ليس لديك صلاحية التلي سيلز'); RW_Auth.doLogout(); return; }
            currentUser = u; pubUserId = u.id;
            supabase.from('app_settings').select('*').limit(1).single().then(function(sRes) { if (sRes.data) { delFee = Number(sRes.data.delivery_fee) || 0; taxRate = Number(sRes.data.tax_rate) || 0; minAmt = Number(sRes.data.min_invoice_amount) || 0; } });
            RW_ImageCache.loadAll(function() { self.enterApp(); });
        }
        if (user) _setup(user);
        else RW_Auth.init(function(u, err) { if (err || !u) { if (err === 'NO_SESSION') return; RW_UI.showError('فشل استعادة الجلسة'); return; } _setup(u); });
    };

    self.enterApp = function() {
        RW_UI.byId('loginScreen').classList.add('hidden'); RW_UI.byId('mainApp').classList.remove('hidden');
        self.updateConnectionStatus();
        window.addEventListener('online', function() { self.updateConnectionStatus(); self.syncPendingOrders(); });
        window.addEventListener('offline', function() { self.updateConnectionStatus(); });
        self.syncDown().then(function() { self.loadBranches(); });
        self.switchTab('today');
    };

    self.doLogout = function() {
        if (_todayInterval) clearInterval(_todayInterval);
        RW_Auth.doLogout(function() { cart = []; selCust = null; RW_UI.byId('mainApp').classList.add('hidden'); RW_UI.byId('loginScreen').classList.remove('hidden'); RW_UI.byId('loginEmail').value = ''; RW_UI.byId('loginPass').value = ''; RW_UI.byId('loginMsg').classList.add('hidden'); });
    };

    self.updateConnectionStatus = function() { RW_UI.updateConnectionStatus('connDot', 'connLabel'); };

    self.syncDown = function() {
        return Promise.all([
            supabase.from('customers').select('*').then(function(r) { customersCache = r.data || []; return db.customers.clear().then(function() { return db.customers.bulkPut(r.data || []); }); }),
            supabase.from('items').select('*').then(function(r) { productsCache = r.data || []; return db.items.clear().then(function() { return db.items.bulkPut(r.data || []); }); }),
            supabase.from('stock_branches').select('*').then(function(r) { return db.stock.clear().then(function() { return db.stock.bulkPut(r.data || []); }); }),
            supabase.from('branches').select('*').then(function(r) { return db.branches.clear().then(function() { return db.branches.bulkPut(r.data || []); }); })
        ]);
    };

    self.syncNow = function() {
        if (!navigator.onLine) { RW_UI.toast('لا يوجد اتصال', 'warning'); return; }
        RW_UI.showLoader('جاري المزامنة...');
        self.syncDown().then(function() { RW_UI.hideLoader(); self.loadBranches(); self.syncPendingOrders(); RW_UI.toast('تمت المزامنة', 'success'); }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشلت المزامنة', 'error'); });
    };

    // ==================== التنقل بين التبويبات ====================
self.switchTab = function(tab) {
    currentTab = tab;
    var btns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('text-blue-600'); btns[i].classList.add('text-gray-400');
        if (btns[i].getAttribute('data-tab') === tab) { btns[i].classList.remove('text-gray-400'); btns[i].classList.add('text-blue-600'); }
    }
    var fc = RW_UI.byId('floatingCart');
    // إخفاء الشريط العائم في جميع التبويبات ما عدا new-order
    if (fc) fc.classList.add('hidden');
    
    if (tab === 'today') self.renderTodayView();
    else if (tab === 'products') self.renderProductsView();
    else if (tab === 'cart') self.renderCartTab();
    else if (tab === 'my-orders') self.renderOrdersView();
};

    self.openNewOrder = function() {
        cart = []; selCust = null;
        var b = RW_UI.byId('creditBanner'); if (b) b.className = 'hidden';
        var i = RW_UI.byId('selectedCustInfo'); if (i) i.classList.add('hidden');
        currentTab = 'new-order';
        self.renderNewOrderView();
    };

    // ==================== تبويب "اليوم" – Call Planner ====================
    self.renderTodayView = function() {
        var c = RW_UI.byId('mainContent'); if (!c) return;
        var h = '<div class="flex-1 overflow-y-auto p-4 no-scrollbar">';
        h += '<div class="mb-4"><p class="text-gray-400 text-sm">صباح الخير، <span class="font-bold text-gray-700">' + (currentUser ? (currentUser.name || currentUser.email) : 'زميل') + '</span> 👋</p></div>';
        h += '<div class="bg-white rounded-2xl shadow-sm border p-4 mb-4"><h3 class="font-bold text-lg mb-2">📊 ملخص الأداء</h3><div id="todaySummary"></div></div>';
        h += '<div class="bg-white rounded-2xl shadow-sm border p-4"><h3 class="font-bold text-lg mb-2">🔥 فرص اليوم</h3><div id="todayOpportunities"></div></div>';
        h += '</div>';
        RW_UI.safeHTML(c, h);
        RW_UI.showSkeleton('todaySummary', 2, 'card');
        RW_UI.showSkeleton('todayOpportunities', 3, 'card');
        self.loadTodaySummary(); self.loadTodayOpportunities();
        clearInterval(_todayInterval);
        _todayInterval = setInterval(function() { self.loadTodaySummary(); self.loadTodayOpportunities(); }, 30000);
    };

    self.loadTodaySummary = function() {
        var today = new Date().toISOString().split('T')[0];
        if (!currentUser) return;
        supabase.from('orders').select('id, total_amount').eq('created_by', currentUser.email).eq('order_date', today).then(function(res) {
            var orders = res.data || [], total = 0;
            for (var i = 0; i < orders.length; i++) total += Number(orders[i].total_amount) || 0;
            RW_UI.safeHTML(RW_UI.byId('todaySummary'), '<div class="grid grid-cols-2 gap-3"><div class="text-center p-3 bg-blue-50 rounded-xl"><p class="text-xs text-gray-500">أوردرات اليوم</p><p class="text-2xl font-black text-blue-600">' + orders.length + '</p></div><div class="text-center p-3 bg-emerald-50 rounded-xl"><p class="text-xs text-gray-500">قيمة اليوم</p><p class="text-2xl font-black text-emerald-600">' + fmtNum(total) + ' ج.م</p></div></div>');
        }).catch(function() { RW_UI.showEmptyState('todaySummary', 'تعذر تحميل الملخص', '📡'); });
    };

    self.loadTodayOpportunities = function() {
        var d = new Date(); d.setDate(d.getDate() - 30); var from = d.toISOString().split('T')[0];
        supabase.from('orders').select('customer_id, customer_name, order_date, total_amount').gte('order_date', from).order('order_date', { ascending: false }).limit(200).then(function(res) {
            var orders = res.data || [], map = {};
            for (var i = 0; i < orders.length; i++) { var o = orders[i], cid = o.customer_id || o.customer_name; if (!map[cid]) map[cid] = { name: o.customer_name || cid, last: o.order_date, cnt: 0, val: 0, days: 0 }; map[cid].cnt++; map[cid].val += Number(o.total_amount) || 0; if (o.order_date > map[cid].last) map[cid].last = o.order_date; }
            var today = new Date();
            for (var k in map) { if (map.hasOwnProperty(k)) { var ld = new Date(map[k].last); map[k].days = Math.floor((today - ld) / (1000 * 60 * 60 * 24)); } }

        });

    self.showProductDetail = function(code, name, unit, price, avail, desc, imgUrl) {
        var inCart = 0; for (var x = 0; x < cart.length; x++) { if (cart[x].code === code) { inCart = cart[x].qty; break; } }
        var imgHtml = imgUrl ? '<img src="' + imgUrl + '" style="width:100%;max-height:300px;object-fit:contain;border-radius:16px;background:#f8fafc;margin-bottom:16px" onerror="this.style.display=\'none\'">' : '<div style="width:100%;height:200px;background:linear-gradient(135deg,#e2e8f0,#f1f5f9);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#94a3b8;margin-bottom:16px"><i class="fa-solid fa-box" style="font-size:60px"></i></div>';
        var stockColor = avail > 10 ? '#10b981' : avail > 0 ? '#f59e0b' : '#ef4444';
        var stockText = avail > 10 ? 'متوفر بكمية كبيرة' : avail > 0 ? 'الكمية محدودة (' + avail + ')' : 'نفد المخزون';
        
        var h = '<div style="text-align:right;font-family:Cairo,sans-serif;direction:rtl" id="productDetailContainer">' + imgHtml;
        h += '<h3 style="font-size:20px;font-weight:800;color:#1e293b;margin-bottom:4px">' + name + '</h3>';
        h += '<p style="font-size:13px;color:#64748b;margin-bottom:12px">الكود: ' + code + ' | الوحدة: ' + unit + '</p>';
        if (desc) h += '<div style="background:#f8fafc;padding:12px;border-radius:12px;margin-bottom:16px;font-size:13px;color:#475569">📝 ' + desc + '</div>';
        h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + stockColor + '"></span><span style="font-size:13px;color:#64748b">' + stockText + '</span></div>';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:16px;border-radius:16px"><span style="font-size:28px;font-weight:800;color:#2563eb">' + fmtNum(price) + ' EGP</span>';
        if (avail > 0) {
            if (inCart > 0) {
                h += '<div style="display:flex;align-items:center;gap:12px" id="detailQtyControls">' +
                    '<button onclick="App._updateDetailQty(\'' + code + '\', -1)" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:2px solid #e2e8f0;font-weight:700;font-size:18px;cursor:pointer;color:#1e293b;display:flex;align-items:center;justify-content:center">-</button>' +
                    '<span style="font-weight:800;font-size:18px;color:#1e293b;min-width:24px;text-align:center" id="detailQtySpan">' + inCart + '</span>' +
                    '<button onclick="App._updateDetailQty(\'' + code + '\', 1)" style="width:36px;height:36px;border-radius:50%;background:#2563eb;border:none;font-weight:700;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button>' +
                    '</div>';
            } else {
                h += '<button onclick="App._addToCartFromDetail(\'' + code + '\')" style="background:#2563eb;color:#fff;padding:10px 24px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer"><i class="fa-solid fa-cart-plus" style="margin-left:6px"></i> أضف للسلة</button>';
            }
        } else { h += '<span style="color:#ef4444;font-weight:700">غير متوفر حالياً</span>'; }
        h += '</div></div>';
        
        Swal.fire({ html: h, width: '450px', showCloseButton: true, showConfirmButton: false, customClass: { popup: '!rounded-3xl !p-5', closeButton: '!text-slate-400 !text-lg' } });
    };

    self._updateDetailQty = function(code, delta) {
        var newQty = 0;
        var found = false;
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].code === code) {
                if (delta > 0) {
                    cart[i].qty++;
                    newQty = cart[i].qty;
                } else {
                    cart[i].qty--;
                    if (cart[i].qty <= 0) {
                        cart.splice(i, 1);
                        newQty = 0;
                    } else {
                        newQty = cart[i].qty;
                    }
                }
                found = true;
                break;
            }
        }
        
        // تحديث السلة العائمة
        self.updateFloatingCart();
        if (cart.length === 0) {
            var fc = RW_UI.byId('floatingCart');
            if (fc) fc.classList.add('hidden');
        }
        
        // تحديث بطاقة المنتج خارج النافذة
        self._updateProductCardQty(code, newQty);
        
        // تحديث DOM النافذة المنبثقة
        var popup = Swal.getPopup();
        if (popup && newQty > 0) {
            var span = popup.querySelector('#detailQtySpan');
            if (span) span.innerText = newQty;
        } else if (popup && newQty === 0) {
            // المنتج لم يعد في السلة، تحويل زر + إلى زر "أضف للسلة"
            var controls = popup.querySelector('#detailQtyControls');
            if (controls) {
                controls.innerHTML = '<button onclick="App._addToCartFromDetail(\'' + code + '\')" style="background:#2563eb;color:#fff;padding:10px 24px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer"><i class="fa-solid fa-cart-plus" style="margin-left:6px"></i> أضف للسلة</button>';
            }
        }
    };

    self._addToCartFromDetail = function(code) {
        self.addToCart(code);
        // تحديث واجهة النافذة المنبثقة بعد الإضافة
        var popup = Swal.getPopup();
        if (popup) {
            var inCart = 0;
            for (var x = 0; x < cart.length; x++) { if (cart[x].code === code) { inCart = cart[x].qty; break; } }
            if (inCart > 0) {
                var detailContainer = popup.querySelector('#detailQtyControls');
                if (!detailContainer) {
                    // ابحث عن زر "أضف للسلة" واستبدله
                    var allButtons = popup.querySelectorAll('button');
                    for (var i = 0; i < allButtons.length; i++) {
                        if (allButtons[i].innerText.indexOf('أضف للسلة') !== -1) {
                            allButtons[i].outerHTML = '<div style="display:flex;align-items:center;gap:12px" id="detailQtyControls">' +
                                '<button onclick="App._updateDetailQty(\'' + code + '\', -1)" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:2px solid #e2e8f0;font-weight:700;font-size:18px;cursor:pointer;color:#1e293b;display:flex;align-items:center;justify-content:center">-</button>' +
                                '<span style="font-weight:800;font-size:18px;color:#1e293b;min-width:24px;text-align:center" id="detailQtySpan">' + inCart + '</span>' +
                                '<button onclick="App._updateDetailQty(\'' + code + '\', 1)" style="width:36px;height:36px;border-radius:50%;background:#2563eb;border:none;font-weight:700;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button>' +
                                '</div>';
                            break;
                        }
                    }
                }
            }
        }
    };

    self.toggleCatalogViewMode = function() { catalogListView = !catalogListView; var i = RW_UI.byId('catalogViewModeIcon'); if (i) i.className = 'fa-solid ' + (catalogListView ? 'fa-list' : 'fa-grip'); self.renderCatalogProducts(); };
    self.onCatalogBranchChange = function(v) { selBranch = v || null; self.renderCatalogProducts(); };
    self.filterCatalogProducts = function(cat) { catalogActiveCat = cat; self.renderCatalogProducts(); };

    self.renderCatalogProducts = function(searchQuery) {
        var c = RW_UI.byId('catalogProductsContainer'); if (!c) return;
        if (!selBranch) { RW_UI.showEmptyState('catalogProductsContainer', 'اختر فرعاً لتصفح المنتجات', '🏭'); return; }
        RW_UI.showSkeleton('catalogProductsContainer', 4, 'grid');
        db.items.toArray().then(function(items) {
            if (!items.length) { RW_UI.showEmptyState('catalogProductsContainer', 'لا توجد منتجات', '📦'); return; }
            var f = items;
            if (catalogActiveCat && catalogActiveCat !== 'الكل') f = items.filter(function(i) { return (i.category || 'أخرى') === catalogActiveCat; });
            var q = (typeof searchQuery === 'string' && searchQuery.trim()) ? searchQuery.trim().toLowerCase() : '';
            if (q) f = f.filter(function(i) { return (i.name || '').toLowerCase().indexOf(q) !== -1 || (i.item_code || '').toLowerCase().indexOf(q) !== -1 || (i.barcode || '').toLowerCase().indexOf(q) !== -1; });
            if (!f.length) { RW_UI.showEmptyState('catalogProductsContainer', 'لا توجد منتجات مطابقة', '🔍'); return; }
            var promises = []; for (var i = 0; i < f.length; i++) promises.push(self.getAvail(f[i].id));
            Promise.all(promises).then(function(avails) {
                var h = catalogListView ? '<div class="space-y-2">' : '<div class="grid grid-cols-2 gap-2">';
                for (var k = 0; k < f.length; k++) h += self._renderProductCard(f[k], avails[k], catalogListView, true);
                h += '</div>'; RW_UI.safeHTML(c, h);
            });
        }).catch(function() { RW_UI.showEmptyState('catalogProductsContainer', 'تعذر تحميل المنتجات', '📡'); });
    };

    // ==================== إدارة السلة ====================
    self.addToCart = function(code) {
        db.items.get(code).then(function(it) {
            if (!it) return;
            self.getAvail(it.id).then(function(avail) {
                var ex = null;
                for (var i = 0; i < cart.length; i++) {
                    if (cart[i].code === code) { ex = cart[i]; break; }
                }
                var cur = ex ? ex.qty : 0;
                var nq = cur + 1;
                var mx = it.max_qty ? Number(it.max_qty) : 0;
                
                if (mx > 0 && nq > mx) {
                    RW_UI.toast('الحد الأقصى للطلب: ' + mx, 'warning');
                    return;
                }
                if (nq > avail) {
                    RW_UI.toast('الرصيد المتاح غير كافٍ. المتاح: ' + avail, 'warning');
                    return;
                }
                
                if (ex) {
                    ex.qty = nq;
                } else {
                    cart.push({
                        code: it.item_code,
                        name: it.name,
                        price: Number(it.sales_price) || 0,
                        unit: it.unit || 'حبة',
                        qty: 1
                    });
                }
                
                // تحديث السلة العائمة
                self.updateFloatingCart();
                
                // تحديث جميع بطاقات المنتج من هذا النوع في الصفحة
                self._updateProductCardQty(code, nq);
                
                // تحديث المودال إذا كان مفتوحاً
                self._refreshCartModalIfOpen();
                self.updateCartTabBadge();
                if (navigator.vibrate) navigator.vibrate(30);
            });
        });
    };

    self.decCart = function(code) {
        var newQty = 0;
        var itemRemoved = false;
        
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].code === code) {
                cart[i].qty--;
                if (cart[i].qty <= 0) {
                    cart.splice(i, 1);
                    itemRemoved = true;
                } else {
                    newQty = cart[i].qty;
                }
                break;
            }
        }
        self.updateCartTabBadge();
        // تحديث السلة العائمة مرة واحدة فقط
        self.updateFloatingCart();
        
        // إخفاء السلة إذا أصبحت فارغة
        if (cart.length === 0) {
            var fc = RW_UI.byId('floatingCart');
            if (fc) fc.classList.add('hidden');
        }
        
        // تحديث بطاقة المنتج
        self._updateProductCardQty(code, itemRemoved ? 0 : newQty);
        
        // تحديث المودال إذا كان مفتوحاً
        self._refreshCartModalIfOpen();
    };

    self._updateProductCardQty = function(code, qty) {
        var cards = document.querySelectorAll('[data-item-code="' + code + '"]');
        for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var qtyContainer = card.querySelector('.cart-qty-controls');
            if (!qtyContainer) continue;
            
            if (qty > 0) {
                qtyContainer.innerHTML = '<div class="flex items-center gap-1">' +
                    '<button onclick="event.stopPropagation();App.decCart(\'' + code + '\')" class="w-6 h-6 bg-gray-100 rounded-full text-xs font-black">-</button>' +
                    '<span class="text-xs font-black w-5 text-center">' + qty + '</span>' +
                    '<button onclick="event.stopPropagation();App.addToCart(\'' + code + '\')" class="w-6 h-6 bg-blue-600 text-white rounded-full text-xs font-black">+</button>' +
                    '</div>';
            } else {
                qtyContainer.innerHTML = '<button onclick="event.stopPropagation();App.addToCart(\'' + code + '\')" class="w-8 h-8 bg-blue-600 text-white rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>';
            }
        }
    };

    // دالة مساعدة لتحديث المودال بأمان
    self._refreshCartModalIfOpen = function() {
        var modal = RW_UI.byId('cartModal');
        if (modal && !modal.classList.contains('hidden')) {
            self.renderCartModalBody();
        }
    };

self.calcTotals = function() {
    var subtotal = 0;
    for (var i = 0; i < cart.length; i++) {
        subtotal += cart[i].price * cart[i].qty;
    }
    if (subtotal === 0) return { sub: 0, del: 0, tax: 0, total: 0 };
    var d = delFee;
    var grandTotal = subtotal + d;
    return { sub: subtotal, del: d, tax: 0, total: grandTotal };
};

self.updateFloatingCart = function() {
    var bar = RW_UI.byId('floatingCart');
    if (!bar) return;
    // ✅ الشريط العائم مخفي دائماً – لدينا تبويب "السلة" الآن
    bar.classList.add('hidden');
    self.updateCartTabBadge();
};

    self.openCartModal = function() { if (cart.length === 0) return; RW_UI.byId('cartModal').classList.remove('hidden'); self.renderCartModalBody(); };
    self.closeCartModal = function() { RW_UI.byId('cartModal').classList.add('hidden'); };

    self.renderCartModalBody = function() {
        var h = '', t = self.calcTotals();
        for (var i = 0; i < cart.length; i++) {
            var it = cart[i];
            h += '<div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl">' +
                '<div class="flex-1 min-w-0"><div class="font-bold text-sm">' + it.name + '</div><div class="text-xs text-gray-400">' + fmtNum(it.price) + ' × ' + it.qty + '</div></div>' +
                '<div class="flex items-center gap-2 mr-3">' +
                    '<button onclick="App.decCart(\'' + it.code + '\')" class="w-7 h-7 bg-red-100 text-red-600 rounded-full text-xs font-black">-</button>' +
                    '<span class="text-sm font-black w-6 text-center">' + it.qty + '</span>' +
                    '<button onclick="App.addToCart(\'' + it.code + '\')" class="w-7 h-7 bg-blue-600 text-white rounded-full text-xs font-black">+</button>' +
                '</div></div>';
        }
        RW_UI.safeHTML(RW_UI.byId('cartModalBody'), h || '<div class="text-center text-gray-400 py-10">السلة فارغة</div>');
        RW_UI.byId('cartModalTotal').innerText = fmtNum(t.total);
    };

// ✅ دالة مساعدة جديدة – تتعامل مع addToCart غير المتزامن
self._changeCartQty = function(code, delta) {
    if (delta > 0) {
        // الزيادة – addToCart غير متزامنة، لذا ننتظر التحديث ثم نعيد الرسم
        self.addToCart(code);
        // نراقب تغير cart ونعيد الرسم بعد فترة قصيرة جداً
        setTimeout(function() {
            self.renderCartTab();
        }, 150);
    } else {
        // النقصان – decCart متزامنة، لكن للتأكد من تحديث البطاقات ننتظر قليلاً
        self.decCart(code);
        setTimeout(function() {
            self.renderCartTab();
        }, 50);
    }
};

self.updateCartTabBadge = function() {
    var badge = RW_UI.byId('cartTabBadge');
    if (!badge) return;
    if (cart.length > 0) {
        badge.classList.remove('hidden');
        badge.innerText = cart.length > 99 ? '99+' : cart.length;
    } else {
        badge.classList.add('hidden');
    }
};

self.clearCartAndReset = function() {

// ==================== حفظ الأوردر ====================
self.submitOrder = function() {
    if (!selCust) { RW_UI.toast('اختر عميلاً أولاً', 'warning'); return; }
    if (!cart.length) { RW_UI.toast('السلة فارغة', 'warning'); return; }
    if (!selBranch) { RW_UI.toast('اختر فرعاً', 'warning'); return; }
    var t = self.calcTotals();
    if (minAmt > 0 && t.total < minAmt) { RW_UI.toast('الحد الأدنى للفاتورة: ' + fmtNum(minAmt), 'warning'); return; }

    var items = [];
    for (var i = 0; i < cart.length; i++) {
        items.push({ code: cart[i].code, name: cart[i].name, price: cart[i].price, qty: cart[i].qty, unit: cart[i].unit });
    }

    var oldOrderCode = editingOrderCode;
    var isEdit = !!oldOrderCode;

    self.closeCartModal();
    RW_UI.showLoader(isEdit ? 'جاري تحديث الأوردر...' : 'جاري حفظ الأوردر...');

    if (isEdit) {
        var orderId = null;

        supabase.from('orders').select('id').eq('order_code', oldOrderCode).maybeSingle()
        .then(function(res) {
            if (!res.data) { throw new Error('الأوردر القديم غير موجود'); }
            orderId = res.data.id;

            return supabase.from('orders').update({
                customer_name: selCust.name,
                area: selCust.area || '',
                total_amount: t.total,
                delivery_fee: t.del,
                order_status: 'Confirmed',
                payment_type: selCust.payment_type || 'أجل',
                branch_id: branchMap[selBranch] || null
            }).eq('id', orderId);
        })
        .then(function(upRes) {
            if (upRes.error) { throw new Error(upRes.error.message); }
            return supabase.from('order_details').delete().eq('order_id', orderId);
        })
        .then(function(delRes) {
            if (delRes.error) { throw new Error(delRes.error.message); }
            var itemCodes = [];
            for (var j = 0; j < items.length; j++) {
                if (itemCodes.indexOf(items[j].code) === -1) itemCodes.push(items[j].code);
            }
            return supabase.from('items').select('id, item_code').in('item_code', itemCodes);
        })
        .then(function(itemRes) {
            if (itemRes.error) { throw new Error(itemRes.error.message); }
            var itemData = itemRes.data || [];
            var itemIdMap = {};
            for (var m = 0; m < itemData.length; m++) {
                itemIdMap[itemData[m].item_code] = itemData[m].id;
            }
            var detailsToInsert = [];
            for (var j = 0; j < items.length; j++) {
                detailsToInsert.push({
                    order_id: orderId,
                    item_id: itemIdMap[items[j].code] || null,
                    item_code: items[j].code,
                    item_name: items[j].name,
                    unit: items[j].unit,
                    unit_price: items[j].price,
                    qty: items[j].qty
                });
            }
            return supabase.from('order_details').insert(detailsToInsert);
        })
        .then(function(insRes) {
            if (insRes.error) { throw new Error(insRes.error.message); }
            RW_UI.hideLoader();
            RW_UI.toast('تم تحديث الأوردر ' + oldOrderCode + ' بنجاح', 'success');
            cart = []; selCust = null; selBranch = null; editingOrderCode = null;
            self.clearCustomer(); self.updateFloatingCart(); self.switchTab('today');
        })
        .catch(function(e) {
            RW_UI.hideLoader();
            RW_UI.showError(e.message || 'فشل تحديث الأوردر');
        });

    } else {
        var hdr = {
            customer_code: selCust.customer_code,
            custName: selCust.name,
            area: selCust.area || '',
            total: t.total,
            deliveryFees: t.del,
            status: 'Confirmed',
            paymentType: selCust.payment_type || 'أجل',
            taxAmount: t.tax,
            taxRate: taxRate
        };
        RW_API.call('save-sales-invoice', { orderHeader: hdr, itemsList: items, branchCode: selBranch }, function(json) {
            RW_UI.hideLoader();
            if (json.success) {
                RW_UI.toast('تم الحفظ: ' + (json.orderID || ''), 'success');
                cart = []; selCust = null; selBranch = null; editingOrderCode = null;
                self.clearCustomer(); self.updateFloatingCart(); self.switchTab('today');
            } else {
                RW_UI.toast(json.msg || 'فشل الحفظ', 'error');
            }
        });
    }
};

self._editOrderFromDetail = function(orderId) {
    Swal.close();
    RW_UI.showLoader('جاري تحميل الأوردر للتعديل...');
    supabase.from('orders').select('*').eq('id', orderId).single().then(function(oRes) {
        var order = oRes.data;
        if (!order) { RW_UI.hideLoader(); RW_UI.toast('الأوردر غير موجود', 'error'); return; }
        if (order.order_status !== 'Draft' && order.order_status !== 'Confirmed') {
            RW_UI.hideLoader();
            RW_UI.toast('لا يمكن تعديل أوردر في حالة: ' + (order.order_status || ''), 'warning');
            return;
        }
        // ✅ تعيين كود الأوردر الذي نعدله
        editingOrderCode = order.order_code;
        supabase.from('order_details').select('*').eq('order_id', order.id).then(function(dRes) {
            RW_UI.hideLoader();
            var details = dRes.data || [];
            if (details.length === 0) { RW_UI.toast('الأوردر لا يحتوي على أصناف', 'warning'); return; }
            // ✅ بناء السلة مباشرة (بدون addToCart غير المتزامنة)
            cart = [];
            for (var i = 0; i < details.length; i++) {
                var det = details[i];
                cart.push({
                    code: det.item_code,
                    name: det.item_name,
                    price: Number(det.unit_price) || 0,
                    unit: det.unit || 'حبة',
                    qty: Number(det.qty) || 1
                });
            }
            // ✅ بناء selCust
            selCust = {
                customer_code: order.customer_id || '',
                name: order.customer_name || 'عميل بدون اسم',
                area: order.area || '',
                phone: order.customer_phone || '',
                payment_type: order.payment_type || 'أجل',
                debt: 0, credit_limit: 0
            };
            // ✅ محاولة إثراء بيانات العميل من Dexie
            if (order.customer_id) {
                db.customers.where('customer_code').equals(order.customer_id).first().then(function(c) {
                    if (c) { selCust = c; }
                    self._finalizeEditCart();
                }).catch(function() { self._finalizeEditCart(); });
            } else { self._finalizeEditCart(); }
        });
    }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشل الاتصال', 'error'); });
};

// ✅ دالة مساعدة جديدة – تكمل عملية التعديل
self._finalizeEditCart = function() {
    if (editingOrderCode) {
        supabase.from('orders').select('branch_id').eq('order_code', editingOrderCode).maybeSingle().then(function(oRes) {
            if (oRes.data && oRes.data.branch_id) {
                db.branches.toArray().then(function(branches) {
                    for (var b = 0; b < branches.length; b++) {
                        if (branches[b].id === oRes.data.branch_id) {
                            selBranch = branches[b].branch_code;
                            break;
                        }
                    }
                    self._commitEdit();
                }).catch(function() { self._commitEdit(); });
            } else { self._commitEdit(); }
        }).catch(function() { self._commitEdit(); });
    } else { self._commitEdit(); }
};

self._commitEdit = function() {
    self.switchTab('cart');
    self.updateCartTabBadge();
    RW_UI.toast('تم تحميل الأوردر ' + (editingOrderCode || '') + ' للتعديل. يمكنك مراجعة السلة والحفظ.', 'success');
};

self._printOrderFromDetail = function(orderId) {
    RW_UI.showLoader('جاري تحضير الطباعة...');

    supabase.from('orders').select('*').eq('id', orderId).single().then(function(oRes) {
        var order = oRes.data;
        if (!order) { RW_UI.hideLoader(); RW_UI.toast('الأوردر غير موجود', 'error'); return; }

        supabase.from('order_details').select('*').eq('order_id', order.id).then(function(dRes) {
            RW_UI.hideLoader();
            var details = dRes.data || [];

            if (details.length === 0) {
                RW_UI.toast('لا توجد أصناف في هذا الأوردر', 'warning');
                return;
            }

            // ==================== تحضير بيانات الطباعة ====================
            var now = new Date();
            var dateStr = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            var timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            // صف الأصناف
            var itemsHtml = '';
            var itemsTotal = 0;
            for (var i = 0; i < details.length; i++) {
                var det = details[i];
                var qty = Number(det.qty) || 0;
                var unitPrice = Number(det.unit_price) || 0;
                var lineTotal = qty * unitPrice;
                itemsTotal += lineTotal;

                itemsHtml += '<tr>' +
                    '<td style="text-align:right;padding:3px 0;border-bottom:1px dashed #ccc;font-size:11px">' +
                    (det.item_name || '') + ' × ' + qty +
                    '</td>' +
                    '<td style="text-align:left;padding:3px 0;border-bottom:1px dashed #ccc;font-size:11px">' +
                    lineTotal.toFixed(2) + ' EGP' +
                    '</td>' +
                    '</tr>';
            }

            var deliveryFee = Number(order.delivery_fee) || 0;
            var grandTotal = Number(order.total_amount) || itemsTotal;

            // ==================== فتح نافذة الطباعة ====================
            var printWindow = window.open('', '_blank', 'width=300,height=600');
            if (!printWindow) {
                RW_UI.toast('الرجاء السماح بالنوافذ المنبثقة للطباعة', 'warning');
                return;
            }

            printWindow.document.write(
                '<!DOCTYPE html>' +
                '<html dir="rtl">' +
                '<head>' +
                '<meta charset="UTF-8">' +
                '<title>إيصال ' + (order.order_code || '') + '</title>' +
                '<style>' +
                'body{font-family:"Cairo",sans-serif;font-size:11px;margin:0;padding:8px;width:280px;color:#000}' +
                'table{width:100%;border-collapse:collapse}' +
                '@media print{body{width:72mm;padding:2mm}@page{margin:0}}' +
                '</style>' +
                '</head>' +
                '<body>' +
                // ترويسة
                '<div style="text-align:center;margin-bottom:6px">' +
                '<h2 style="margin:0;font-size:14px;font-weight:bold">الروائع</h2>' +
                '<p style="margin:1px 0;font-size:9px">' + dateStr + ' | ' + timeStr + '</p>' +
                '<p style="margin:1px 0;font-size:11px;font-weight:bold">فاتورة: ' + (order.order_code || '') + '</p>' +
                '<p style="margin:1px 0;font-size:10px">العميل: ' + (order.customer_name || 'نقدي') + '</p>' +
                (order.area ? '<p style="margin:1px 0;font-size:9px">المنطقة: ' + order.area + '</p>' : '') +
                '<p style="margin:1px 0;font-size:9px">طريقة الدفع: ' + (order.payment_type === 'نقدي' ? 'نقدي' : 'آجل') + '</p>' +
                '</div>' +
                // خط فاصل
                '<hr style="border-top:1px dashed #000;margin:4px 0">' +
                // جدول الأصناف
                '<table>' + itemsHtml + '</table>' +
                // خط فاصل
                '<hr style="border-top:1px dashed #000;margin:4px 0">' +
                // الإجماليات
                '<div style="text-align:left;font-size:13px;font-weight:bold;margin:4px 0">الإجمالي: ' + grandTotal.toFixed(2) + ' EGP</div>' +
                (deliveryFee > 0 ? '<div style="font-size:9px;margin-top:2px">رسوم التوصيل: ' + deliveryFee.toFixed(2) + ' EGP</div>' : '') +
                // رسالة شكر
                '<hr style="border-top:1px dashed #000;margin:4px 0">' +
                '<div style="text-align:center;font-size:9px;margin-top:6px">شكراً لتعاملكم معنا</div>' +
                // سكريبت الطباعة التلقائية
                '<script>window.onload=function(){window.print();window.close();}<\/script>' +
                '</body>' +
                '</html>'
            );
            printWindow.document.close();
        });
    }).catch(function() {
        RW_UI.hideLoader();
        RW_UI.toast('فشل تحميل بيانات الأوردر للطباعة', 'error');
    });
},

        var order = oRes.data;
        if (!order) { RW_UI.hideLoader(); RW_UI.toast('الأوردر غير موجود', 'error'); return; }
        supabase.from('order_details').select('*').eq('order_id', order.id).then(function(dRes) {
            RW_UI.hideLoader();
            var details = dRes.data || [];

            var statusLabel = order.order_status || '';
            if (order.order_status === 'Draft') statusLabel = 'مسودة';
            else if (order.order_status === 'Confirmed') statusLabel = 'مؤكد';
            else if (order.order_status === 'Pending') statusLabel = 'قيد الانتظار';
            else if (order.order_status === 'Invoiced') statusLabel = 'مفوتر';
            else if (order.order_status === 'Delivered') statusLabel = 'تم التوصيل';
            else if (order.order_status === 'Cancelled') statusLabel = 'ملغي';

            var canEdit = (order.order_status === 'Draft' || order.order_status === 'Confirmed');

            var html = '<div class="text-right">';
            html += '<div class="bg-gray-50 p-4 rounded-xl mb-4">';
            html += '<div class="flex justify-between mb-2"><span class="font-black text-lg">' + (order.order_code || '') + '</span><span class="text-sm font-bold">' + statusLabel + '</span></div>';
            html += '<p><strong>العميل:</strong> ' + (order.customer_name || '') + '</p>';
            html += '<p><strong>المنطقة:</strong> ' + (order.area || '') + '</p>';
            html += '<p><strong>التاريخ:</strong> ' + (order.order_date ? new Date(order.order_date).toLocaleDateString('ar-EG') : '') + '</p>';
            html += '<p><strong>طريقة الدفع:</strong> ' + (order.payment_type || '') + '</p></div>';

            if (details.length > 0) {
                html += '<div class="overflow-x-auto"><table class="w-full text-sm border"><thead class="bg-gray-100"><tr><th class="p-2">الصنف</th><th class="p-2 text-center">الكمية</th><th class="p-2 text-center">السعر</th><th class="p-2 text-center">الإجمالي</th></tr></thead><tbody>';
                var itemsTotal = 0;
                for (var i = 0; i < details.length; i++) {
                    var d = details[i];
                    var lt = Number(d.line_amount) || (Number(d.qty) * Number(d.unit_price));
                    itemsTotal += lt;
                    html += '<tr><td class="p-2 font-semibold">' + (d.item_name || '') + '</td><td class="p-2 text-center">' + d.qty + '</td><td class="p-2 text-center">' + fmtNum(d.unit_price) + '</td><td class="p-2 text-center font-bold">' + fmtNum(lt) + '</td></tr>';
                }
                html += '</tbody></table></div>';

                var deliveryFee = Number(order.delivery_fee) || 0;
                var grandTotal = Number(order.total_amount) || itemsTotal;

                html += '<div class="bg-white rounded-2xl shadow-sm border p-4 mt-4">';
                html += '<h3 class="font-bold text-sm mb-3">🧾 تفاصيل الفاتورة</h3>';
                html += '<div class="space-y-2 text-sm">';
                html += '<div class="flex justify-between"><span class="text-gray-500">مجموع الأصناف</span><span class="font-bold">' + fmtNum(itemsTotal) + ' EGP</span></div>';
                if (deliveryFee > 0) {
                    html += '<div class="flex justify-between"><span class="text-gray-500">رسوم التوصيل</span><span class="font-bold text-blue-600">' + fmtNum(deliveryFee) + ' EGP</span></div>';
                }
                html += '<hr class="my-2">';
                html += '<div class="flex justify-between text-lg"><span class="font-black">الإجمالي النهائي</span><span class="font-black text-emerald-600">' + fmtNum(grandTotal) + ' EGP</span></div>';
                html += '</div></div>';
            }

            html += '<div class="flex gap-2 mt-4 pt-3 border-t">';
            if (canEdit) {
                html += '<button onclick="App._editOrderFromDetail(\'' + order.id + '\')" class="flex-1 bg-amber-500 text-white py-2 rounded-lg font-bold text-sm"><i class="fa-solid fa-pen-to-square ml-1"></i>تعديل الطلب</button>';
            }
            html += '<button onclick="App._deleteOrderFromDetail(\'' + order.order_code + '\')" class="flex-1 bg-red-600 text-white py-2 rounded-lg font-bold text-sm"><i class="fa-solid fa-trash ml-1"></i>حذف الأوردر</button>';
            html += '<button onclick="App._printOrderFromDetail(\'' + order.id + '\')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm"><i class="fa-solid fa-print ml-1"></i>طباعة</button>';
            html += '</div>';
            html += '</div>';

            Swal.fire({
                title: 'تفاصيل الأوردر',
                html: html,
                width: '700px',
                showCloseButton: true,
                showConfirmButton: false,
                customClass: { popup: '!rounded-3xl' }
            });
        });
    }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشل الاتصال', 'error'); });
};

    return self;
})();

RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded', function() { App.init(); });
// إغلاق قائمة البحث السريع عند النقر خارجها
document.addEventListener('click', function(e) {
    var resultsDiv = document.getElementById('quickSearchResults');
    var searchInput = document.getElementById('quickItemSearch');
    if (resultsDiv && !resultsDiv.classList.contains('hidden')) {
        if (e.target !== searchInput && !resultsDiv.contains(e.target)) {
            resultsDiv.classList.add('hidden');
        }
    }
});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
