<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مدير المبيعات | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <script>var supabase = window.supabase;</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent}
        .auth-container{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 40%,#1e40af 100%)}
        .input-field:focus{border-color:#1e3a8a;box-shadow:0 0 0 3px rgba(30,58,138,0.1)}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .animate-fadeIn{animation:fadeIn .3s}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .stat-card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
        .kpi-up{color:#10b981}.kpi-down{color:#ef4444}
        .heat-bar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden}
        .heat-fill{height:100%;border-radius:4px;transition:width 0.5s}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-blue-800 to-blue-950 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-crown text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">مدير المبيعات</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-800 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-800 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-blue-800 to-blue-900 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-blue-900 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">مدير المبيعات</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="flex gap-1 p-2 bg-white border-b overflow-x-auto flex-shrink-0">
        <button onclick="App.switchTab('performance')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm bg-blue-900 text-white" id="tab-performance">📊 KPI</button>
        <button onclick="App.switchTab('targets')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-targets">🎯 الأهداف</button>
        <button onclick="App.switchTab('reports')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-reports">📋 التقارير</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_SalesManager'); db.version(1).stores({ meta: 'key', cache: 'key' });

var App = {
    currentUser: null, currentTab: 'performance', charts: {},

    togglePass: function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
    doLogin: function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}RW_UI.byId('loginMsg').classList.add('hidden');var s=this;RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}else{s.init();}});},
    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return;}var isO=user.isOwner,perms=user.permissions,has=isO||(Array.isArray(perms)&&perms.indexOf('reports')!==-1);if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;s.enterApp();});},
    enterApp: function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.switchTab('performance');},
    doLogout: function(){var s=this;RW_Auth.doLogout(function(){s.currentUser=null;RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');RW_UI.byId('loginEmail').value='';RW_UI.byId('loginPass').value='';RW_UI.byId('loginMsg').classList.add('hidden');});},
    switchTab: function(t){this.currentTab=t;['performance','targets','reports'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('bg-blue-900','text-white');b.classList.add('text-gray-500');}});var a=RW_UI.byId('tab-'+t);if(a){a.classList.add('bg-blue-900','text-white');a.classList.remove('text-gray-500');}if(t==='performance')this.renderPerformance();else if(t==='targets')this.renderTargets();else if(t==='reports')this.renderReports();},
    destroyCharts: function(){for(var k in this.charts){if(this.charts.hasOwnProperty(k)&&this.charts[k]){this.charts[k].destroy();this.charts[k]=null;}}},

    renderPerformance: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>');
        var today=new Date().toISOString().split('T')[0],firstDay=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0],prevFirst=new Date(new Date().getFullYear(),new Date().getMonth()-1,1).toISOString().split('T')[0],prevLast=new Date(new Date().getFullYear(),new Date().getMonth(),0).toISOString().split('T')[0],daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(),todayDay=new Date().getDate();
        Promise.all([supabase.from('orders').select('total_amount,payment_type,order_date,area').gte('order_date',firstDay).lte('order_date',today),supabase.from('orders').select('total_amount').gte('order_date',prevFirst).lte('order_date',prevLast),supabase.from('users').select('email').in('role',['مندوب مبيعات','مندوب بيع مباشر','كاشير','تلي سيلز'])]).then(function(r){
            var orders=r[0].data||[],prevOrders=r[1].data||[],users=r[2].data||[];var total=0,cash=0,credit=0,areaMap={};
            for(var i=0;i<orders.length;i++){total+=Number(orders[i].total_amount)||0;if(orders[i].payment_type==='نقدي')cash++;else credit++;var ar=orders[i].area||'غير محدد';areaMap[ar]=(areaMap[ar]||0)+(Number(orders[i].total_amount)||0);}
            var prevTotal=0;for(var j=0;j<prevOrders.length;j++)prevTotal+=Number(prevOrders[j].total_amount)||0;
            var growth=prevTotal>0?Math.round(((total-prevTotal)/prevTotal)*100):0,avgOrder=orders.length>0?Math.round(total/orders.length):0,projected=Math.round((total/todayDay)*daysInMonth),dailyAvg=Math.round(total/todayDay),topArea='',topAreaVal=0;
            for(var k in areaMap){if(areaMap.hasOwnProperty(k)&&areaMap[k]>topAreaVal){topAreaVal=areaMap[k];topArea=k;}}
            s.destroyCharts();
            var html='<h2 class="text-lg font-black mb-2">📊 مؤشرات الأداء – الشهر الحالي</h2><p class="text-xs text-gray-400 mb-4">مقارنة بالشهر السابق</p>';
            html+='<div class="grid grid-cols-2 gap-3 mb-4">';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">إجمالي المبيعات</p><p class="text-2xl font-black text-blue-900">'+fmtNum(total)+' ج.م</p><p class="text-xs mt-1 '+(growth>=0?'kpi-up':'kpi-down')+'"><i class="fa-solid fa-'+(growth>=0?'arrow-up':'arrow-down')+' ml-1"></i> '+(growth>=0?'+':'')+growth+'%</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">عدد الأوردرات</p><p class="text-2xl font-black text-emerald-600">'+orders.length+'</p><p class="text-xs text-gray-400 mt-1">'+fmtNum(avgOrder)+' ج.م متوسط</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">توقعات الشهر</p><p class="text-2xl font-black text-purple-600">'+fmtNum(projected)+' ج.م</p><p class="text-xs text-gray-400 mt-1">'+fmtNum(dailyAvg)+' ج.م/يومياً</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">أفضل منطقة</p><p class="text-xl font-black text-amber-600">'+(topArea||'---')+'</p><p class="text-xs text-gray-400 mt-1">'+fmtNum(topAreaVal)+' ج.م</p></div></div>';
            html+='<div class="grid grid-cols-2 gap-3 mb-4"><div class="stat-card text-center"><p class="text-xs text-gray-400">💵 نقدي</p><p class="text-xl font-black text-green-600">'+cash+'</p><p class="text-xs text-gray-400">'+fmtNum(cash>0?Math.round((cash/orders.length)*100):0)+'%</p></div><div class="stat-card text-center"><p class="text-xs text-gray-400">📋 آجل</p><p class="text-xl font-black text-orange-600">'+credit+'</p><p class="text-xs text-gray-400">'+fmtNum(credit>0?Math.round((credit/orders.length)*100):0)+'%</p></div><div class="stat-card text-center"><p class="text-xs text-gray-400">👥 المندوبين</p><p class="text-xl font-black text-indigo-600">'+users.length+'</p></div><div class="stat-card text-center"><p class="text-xs text-gray-400">📈 نمو</p><p class="text-xl font-black '+(growth>=0?'kpi-up':'kpi-down')+'">'+(growth>=0?'+':'')+growth+'%</p></div></div>';
            html+='<div class="card mb-4"><h3 class="font-bold mb-3">📈 تريند المبيعات اليومية</h3><div style="height:250px"><canvas id="chart-trend"></canvas></div></div>';
            html+='<div class="card mb-4"><h3 class="font-bold mb-3">🗺️ المبيعات حسب المنطقة</h3><div style="height:250px"><canvas id="chart-area"></canvas></div></div>';
            RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
            setTimeout(function(){var days={},labels=[],data=[];for(var i=0;i<orders.length;i++){var d=orders[i].order_date||'';days[d]=(days[d]||0)+(Number(orders[i].total_amount)||0);}var st=new Date(firstDay),en=new Date(today);for(var dt=new Date(st);dt<=en;dt.setDate(dt.getDate()+1)){labels.push(dt.toISOString().split('T')[0]);data.push(days[labels[labels.length-1]]||0);}var ctx=RW_UI.byId('chart-trend');if(ctx&&typeof Chart!=='undefined'){s.charts['trend']=new Chart(ctx.getContext('2d'),{type:'line',data:{labels:labels,datasets:[{label:'المبيعات (ج.م)',data:data,borderColor:'#1e3a8a',backgroundColor:'rgba(30,58,138,0.1)',fill:true,tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top'}}}});}var aLabels=[],aData=[];for(var k in areaMap){if(areaMap.hasOwnProperty(k)){aLabels.push(k);aData.push(areaMap[k]);}}var ctx2=RW_UI.byId('chart-area');if(ctx2&&typeof Chart!=='undefined'){s.charts['area']=new Chart(ctx2.getContext('2d'),{type:'doughnut',data:{labels:aLabels,datasets:[{data:aData,backgroundColor:['#1e3a8a','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'right'}}}});}},300);
        }).catch(function(){RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-red-500">فشل تحميل البيانات</div>');});
    },

    renderTargets: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>');
        var today=new Date().toISOString().split('T')[0],firstDay=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0];
        supabase.from('users').select('email,name,role').in('role',['مندوب مبيعات','مندوب بيع مباشر','كاشير','تلي سيلز']).then(function(uR){var users=uR.data||[];
            supabase.from('orders').select('created_by,total_amount').gte('order_date',firstDay).lte('order_date',today).then(function(oR){var orders=oR.data||[],stats={},grandTotal=0;
                for(var i=0;i<orders.length;i++){var by=orders[i].created_by||'';stats[by]=(stats[by]||0)+(Number(orders[i].total_amount)||0);grandTotal+=Number(orders[i].total_amount)||0;}
                users.sort(function(a,b){return(stats[b.email]||0)-(stats[a.email]||0);});
                var html='<h2 class="text-lg font-black mb-2">🎯 الأهداف – الشهر الحالي</h2><p class="text-xs text-gray-400 mb-4">إجمالي المبيعات: '+fmtNum(grandTotal)+' ج.م</p>';
                if(!users.length){html+='<div class="card text-center text-gray-500">لا يوجد مندوبون</div>';}
                else{for(var j=0;j<users.length;j++){var u=users[j],sold=stats[u.email]||0,target=50000,pct=Math.min(100,Math.round((sold/target)*100)),barC=pct>=100?'bg-emerald-500':pct>=50?'bg-blue-500':'bg-red-400',share=grandTotal>0?Math.round((sold/grandTotal)*100):0;
                html+='<div class="card mb-3"><div class="flex justify-between items-center mb-2"><span class="font-bold">'+(u.name||u.email)+'</span><span class="text-xs text-gray-400">'+(u.role||'')+' | حصة: '+share+'%</span></div><div class="flex justify-between text-xs font-bold mb-1"><span>'+fmtNum(sold)+' ج.م</span><span>الهدف: '+fmtNum(target)+' ج.م</span></div><div class="heat-bar"><div class="heat-fill '+barC+'" style="width:'+pct+'%"></div></div><p class="text-xs text-gray-400 mt-1">'+pct+'% من الهدف</p></div>';}}
                RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
            });
        }).catch(function(){RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-red-500">فشل تحميل البيانات</div>');});
    },

    renderReports: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>');
        var today=new Date().toISOString().split('T')[0],td=new Date();td.setDate(td.getDate()-30);var fromDef=td.toISOString().split('T')[0];
        Promise.all([supabase.from('orders').select('customer_name,total_amount').gte('order_date',fromDef).lte('order_date',today),supabase.from('order_details').select('item_name,qty').gte('created_at',fromDef).lte('created_at',today)]).then(function(r){
            var orders=r[0].data||[],details=r[1].data||[],cMap={};for(var i=0;i<orders.length;i++){var cn=orders[i].customer_name||'غير محدد';cMap[cn]=(cMap[cn]||0)+(Number(orders[i].total_amount)||0);}
            var topC=[];for(var k in cMap){if(cMap.hasOwnProperty(k))topC.push({name:k,total:cMap[k]});}topC.sort(function(a,b){return b.total-a.total;});topC=topC.slice(0,10);
            var iMap={};for(var j=0;j<details.length;j++){var inm=details[j].item_name||'غير محدد';iMap[inm]=(iMap[inm]||0)+(Number(details[j].qty)||0);}
            var topI=[];for(var k2 in iMap){if(iMap.hasOwnProperty(k2))topI.push({name:k2,qty:iMap[k2]});}topI.sort(function(a,b){return b.qty-a.qty;});topI=topI.slice(0,10);
            var html='<h2 class="text-lg font-black mb-4">📋 تقارير – آخر ٣٠ يوماً</h2>';
            html+='<div class="card mb-4"><h3 class="font-bold mb-2"><i class="fa-solid fa-users ml-2 text-blue-600"></i> أفضل ١٠ عملاء</h3>';
            if(!topC.length){html+='<p class="text-gray-400 text-center">لا توجد بيانات</p>';}else{html+='<table class="w-full text-sm"><thead><tr class="bg-gray-50"><th class="p-2">العميل</th><th class="p-2 text-center">الإجمالي</th></tr></thead><tbody>';for(var c=0;c<topC.length;c++){html+='<tr class="border-t"><td class="p-2 font-semibold">'+topC[c].name+'</td><td class="p-2 text-center font-bold">'+fmtNum(topC[c].total)+' ج.م</td></tr>';}html+='</tbody></table>';}
            html+='</div><div class="card"><h3 class="font-bold mb-2"><i class="fa-solid fa-boxes-stacked ml-2 text-purple-600"></i> أفضل ١٠ أصناف</h3>';
            if(!topI.length){html+='<p class="text-gray-400 text-center">لا توجد بيانات</p>';}else{html+='<table class="w-full text-sm"><thead><tr class="bg-gray-50"><th class="p-2">الصنف</th><th class="p-2 text-center">الكمية</th></tr></thead><tbody>';for(var it=0;it<topI.length;it++){html+='<tr class="border-t"><td class="p-2 font-semibold">'+topI[it].name+'</td><td class="p-2 text-center font-bold">'+topI[it].qty+'</td></tr>';}html+='</tbody></table>';}
            html+='</div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        }).catch(function(){RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-red-500">فشل تحميل التقارير</div>');});
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
