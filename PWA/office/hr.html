<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الموارد البشرية | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#db2777">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <script>var supabase = window.supabase;</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#831843 0%,#be185d 40%,#db2777 100%)}
        .input-field:focus{border-color:#db2777;box-shadow:0 0 0 3px rgba(219,39,119,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .stat-card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-pink-600 to-pink-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-id-card text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">الموارد البشرية</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-pink-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-pink-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-pink-600 to-pink-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-pink-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">👥 الموارد البشرية</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="flex gap-1 p-2 bg-white border-b overflow-x-auto flex-shrink-0">
        <button onclick="App.switchTab('employees')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm bg-pink-600 text-white" id="tab-employees">👥 الموظفين</button>
        <button onclick="App.switchTab('attendance')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-attendance">🕐 الحضور</button>
        <button onclick="App.switchTab('salary')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-salary">💵 الرواتب</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_HR'); db.version(1).stores({ meta: 'key' });

var App = {
    currentUser: null,
    togglePass: function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
    doLogin: function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}RW_UI.byId('loginMsg').classList.add('hidden');var s=this;RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}else{s.init();}});},
    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return;}var isO=user.isOwner,perms=user.permissions,has=isO||(Array.isArray(perms)&&perms.indexOf('users')!==-1);if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;s.enterApp();});},
    enterApp: function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.switchTab('employees');},
    doLogout: function(){var s=this;RW_Auth.doLogout(function(){RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');});},
    switchTab: function(t){['employees','attendance','salary'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('bg-pink-600','text-white');b.classList.add('text-gray-500');}});var a=RW_UI.byId('tab-'+t);if(a){a.classList.add('bg-pink-600','text-white');a.classList.remove('text-gray-500');}if(t==='employees')this.renderEmployees();else if(t==='attendance')this.renderAttendance();else if(t==='salary')this.renderSalary();},

    renderEmployees: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        supabase.from('users').select('name,email,role,status,phone,salary,allowances,deductions').then(function(r){var users=r.data||[],html='<h2 class="text-lg font-black mb-4">👥 الموظفين</h2>';
        for(var i=0;i<users.length;i++){var u=users[i],st=u.status==='Active'?'bg-green-100 text-green-700':'bg-red-100 text-red-700',initials=(u.name||'؟').charAt(0);
        html+='<div class="card mb-3"><div class="flex items-center gap-4 mb-3"><div class="w-12 h-12 bg-pink-500 rounded-xl flex items-center justify-center text-white font-black text-lg">'+initials+'</div><div><span class="font-bold">'+u.name+'</span><p class="text-xs text-gray-400">'+u.role+' | '+u.email+'</p></div><span class="px-2 py-0.5 rounded-full text-xs font-bold mr-auto '+st+'">'+(u.status==='Active'?'نشط':'غير نشط')+'</span></div><div class="grid grid-cols-3 gap-2 text-center text-sm"><div><p class="text-xs text-gray-400">الراتب</p><p class="font-bold">'+fmtNum(u.salary)+'</p></div><div><p class="text-xs text-gray-400">البدلات</p><p class="font-bold text-green-600">'+fmtNum(u.allowances)+'</p></div><div><p class="text-xs text-gray-400">الصافي</p><p class="font-bold text-pink-600">'+fmtNum((u.salary||0)+(u.allowances||0)-(u.deductions||0))+'</p></div></div></div>';}
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);});
    },

    renderAttendance: function(){RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-clock text-4xl mb-3"></i><p>الحضور والانصراف – قيد التطوير</p></div>');},
    renderSalary: function(){RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-money-bill-wave text-4xl mb-3"></i><p>مسيرات الرواتب – قيد التطوير</p></div>');}
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
